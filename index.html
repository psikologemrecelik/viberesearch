<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychNexus // Minimalist Akademik Keşif & Q1 Dergi Terminali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-deep: #05070b;
      --neon-cyan: #06b6d4;
      --neon-violet: #8b5cf6;
      --neon-emerald: #10b981;
    }
    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(at 15% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 45%),
        radial-gradient(at 85% 0%, rgba(139, 92, 246, 0.07) 0px, transparent 45%);
      color: #e2e8f0;
      overflow-x: hidden;
    }
    /* Lüks Füme Siyah Glassmorphism */
    .glass-nav {
      background: rgba(8, 11, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-panel {
      background: rgba(13, 18, 29, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
    }
    .glass-card {
      background: rgba(15, 21, 34, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      background: rgba(19, 27, 44, 0.82);
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 12px 32px -12px rgba(6, 182, 212, 0.18), inset 0 1px 0 0 rgba(6, 182, 212, 0.2);
      transform: translateY(-1px);
    }
    /* Arama Kelimesi Vurgulama (Highlight) */
    mark.search-hl {
      background: rgba(6, 182, 212, 0.22);
      color: #67e8f9;
      border-bottom: 1.5px solid #06b6d4;
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 600;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #05070b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200 pb-20 md:pb-10">

  <!-- 1. MİNİMALİST ÜST KOMUTA VE SCHOLAR ARAMA ÇUBUĞU -->
  <header class="sticky top-0 z-30 glass-nav px-4 py-3">
    <div class="max-w-5xl mx-auto flex flex-col gap-3">
      
      <!-- Üst Satır: Logo, Scholar Arama Kutusu ve Temel Modüller -->
      <div class="flex items-center justify-between gap-3">
        
        <!-- Logo -->
        <div onclick="resetAllFilters()" class="flex items-center gap-2.5 cursor-pointer shrink-0 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500/20 to-violet-600/20 border border-cyan-500/40 flex items-center justify-center shadow-lg shadow-cyan-500/10 font-mono font-bold text-base text-cyan-300 group-hover:border-cyan-400 transition">
            Ψ
          </div>
          <div class="hidden sm:block">
            <div class="flex items-center gap-1.5">
              <span class="text-sm font-bold tracking-tight text-white">PsychNexus</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">v3.0</span>
            </div>
            <p class="text-[10px] text-slate-500 font-mono">Q1 Journal & Scholar Stream</p>
          </div>
        </div>

        <!-- Merkez: Scholar Küresel Arama Çubuğu + Canlı Autocomplete -->
        <div class="relative flex-1 max-w-2xl">
          <div class="flex items-center bg-slate-900/90 border border-slate-700/80 focus-within:border-cyan-400 focus-within:ring-1 focus-within:ring-cyan-400/30 rounded-xl transition overflow-hidden">
            
            <!-- Arama Kapsamı Seçici (Varsayılan: Scholar Küresel Mod) -->
            <button 
              id="searchScopeBtn"
              onclick="toggleSearchScope()"
              title="Arama kapsamını değiştirmek için dokunun"
              class="px-3 py-2 text-[11px] font-mono border-r border-slate-800 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 transition shrink-0 flex items-center gap-1">
              <span id="searchScopeIcon">🌐</span>
              <span id="searchScopeText" class="hidden md:inline">Scholar Küresel</span>
            </button>

            <!-- Arama Girdisi -->
            <input 
              id="searchInput" 
              type="text" 
              autocomplete="off"
              oninput="handleSearchTyping()"
              placeholder="Makale, kavram veya yazar ara (Türkçe veya İngilizce)..." 
              class="w-full bg-transparent px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none font-mono"
            />

            <!-- Temizle Butonu -->
            <button 
              id="clearSearchBtn"
              onclick="clearSearchInput()" 
              class="hidden px-2 text-slate-500 hover:text-slate-200 text-xs font-mono">
              ✕
            </button>

            <!-- Ara Butonu -->
            <button 
              onclick="triggerNewSearch()" 
              class="px-3.5 py-2 bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 font-mono text-xs font-medium border-l border-slate-800 transition shrink-0">
              Ara
            </button>
          </div>

          <!-- Canlı Otomatik Tamamlama (Autocomplete) Açılır Menüsü -->
          <div id="autocompleteDropdown" class="hidden absolute left-0 right-0 top-full mt-1.5 glass-panel rounded-xl border border-slate-700/90 shadow-2xl z-50 overflow-hidden divide-y divide-slate-800/80"></div>
        </div>

        <!-- Sağ: Minimalist Aksiyon Butonları -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button 
            onclick="toggleFilterPopover()" 
            id="filterBtn"
            class="px-3 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-xs font-mono text-slate-300 flex items-center gap-1.5 transition">
            <span>⚙️</span>
            <span class="hidden lg:inline">Filtreler</span>
          </button>

          <button 
            onclick="openJournalCatalog()" 
            class="px-3 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-xs font-mono text-emerald-300 flex items-center gap-1.5 transition">
            <span>🏛️</span>
            <span class="hidden lg:inline">Dergiler</span>
          </button>

          <button 
            onclick="toggleVaultMode()" 
            id="vaultBtn"
            class="px-3 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-xs font-mono text-amber-300 flex items-center gap-1.5 transition">
            <span>⭐</span>
            <span id="vaultBadge" class="text-[11px] font-bold">0</span>
          </button>
        </div>

      </div>

      <!-- AÇILIR MİNİMALİST FİLTRE PANELİ (Sadece Butona Basınca Açılır - Gürültüyü Önler) -->
      <div id="filterPopover" class="hidden pt-3 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
        <div>
          <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Sıralama Ölçütü</label>
          <select id="sortSelect" onchange="resetAndFetch()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
            <option value="publication_date:desc">En Güncel Yayınlar (Tarih ↓)</option>
            <option value="relevance_score:desc">Scholar Alaka Düzeyi (BM25 ↓)</option>
            <option value="cited_by_count:desc">En Yüksek Atıf Sayısı (Atıf ↓)</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Yayın Yılı Aralığı</label>
          <select id="yearSelect" onchange="resetAndFetch()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
            <option value="2024-2027" selected>Son Dönem (2024 - Güncel)</option>
            <option value="2026-2027">Sadece Bu Yıl (2026+)</option>
            <option value="2021-2027">Son 5 Yıl (2021+)</option>
            <option value="all">Tüm Zamanlar (Klasikler Dahil)</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Çalışma Metodolojisi</label>
          <select id="methodSelect" onchange="applyClientFilters()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
            <option value="ALL">Tüm Metodolojiler</option>
            <option value="Meta-Analiz / Derleme">Meta-Analiz & Sistematik Derleme</option>
            <option value="Deneysel / RKÇ">Deneysel / Randomize Kontrollü</option>
            <option value="Nörogörüntüleme">fMRI / EEG / Nörogörüntüleme</option>
            <option value="Boylamasına">Boylamasına (Longitudinal)</option>
            <option value="Psikometri / Ölçek">Psikometri & Ölçek Geliştirme</option>
          </select>
        </div>

        <div class="flex flex-col justify-end gap-2">
          <label class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 cursor-pointer">
            <span class="text-[11px] font-mono text-slate-300">Sadece Açık Erişim (PDF)</span>
            <input type="checkbox" id="oaToggle" onchange="resetAndFetch()" class="accent-cyan-400">
          </label>
          <label class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 cursor-pointer">
            <span class="text-[11px] font-mono text-slate-300">İleri Tarihleri Gizle</span>
            <input type="checkbox" id="hideFutureToggle" onchange="resetAndFetch()" class="accent-cyan-400">
          </label>
        </div>
      </div>

    </div>
  </header>

  <!-- 2. ANA İÇERİK ALANI (MİNİMALİST ODAKLANMIŞ TEK SÜTUN) -->
  <main class="max-w-5xl mx-auto px-4 pt-4 space-y-4">

    <!-- YATAY PSİKOLOJİ ALT DALLARI ŞERİDİ (Kaydırılabilir, Temiz) -->
    <section class="space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-mono uppercase tracking-wider text-slate-500">1. Disiplin Seçimi</span>
        <div class="flex items-center gap-2">
          <!-- Kompakt vs Standart Kart Görünümü Anahtarı -->
          <button onclick="toggleDensityMode()" id="densityBtn" class="text-[11px] font-mono text-slate-400 hover:text-cyan-300 transition">
            ☰ Görünüm: Standart Kart
          </button>
        </div>
      </div>
      <div id="domainStrip" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
    </section>

    <!-- SEÇİLİ ALANIN AMİRAL GEMİSİ (Q1) DERGİLERİ GEÇİŞ RAYI -->
    <section class="glass-panel rounded-2xl p-3.5 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-mono uppercase tracking-wider text-cyan-400 font-semibold">2. Q1 Dergi Akışı:</span>
          <span id="activeVenueLabel" class="text-xs font-semibold text-white">Tüm Elit Q1 Havuzu</span>
        </div>

        <!-- Hızlı Önceki/Sonraki Dergi ve Resmi Site Kontrolleri -->
        <div class="flex items-center gap-1.5">
          <a id="venueOfficialLink" href="#" target="_blank" rel="noopener noreferrer" class="hidden text-[11px] font-mono px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition">
            🌐 Dergi Resmi Sitesi ↗
          </a>
          <button onclick="stepJournal(-1)" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-[11px] font-mono transition" title="Önceki Dergi (Klavye: [ )">
            ‹ Önceki
          </button>
          <button onclick="stepJournal(1)" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-[11px] font-mono transition" title="Sonraki Dergi (Klavye: ] )">
            Sonraki ›
          </button>
        </div>
      </div>

      <!-- Yatay Kaydırılabilir Dergi Çipleri -->
      <div id="journalStrip" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5"></div>
    </section>

    <!-- AKTİF FİLTRE VE ARAMA DURUM ÇUBUĞU (Sadece Filtre/Arama Varsa Belirir) -->
    <div id="activeStatusStrip" class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs font-mono">
      <div id="activeBreadcrumbs" class="flex flex-wrap items-center gap-1.5"></div>
      <div id="resultCountText" class="text-[11px] text-slate-400 ml-auto">Yükleniyor...</div>
    </div>

    <!-- AKILLI KURTARMA (SMART FALLBACK) BİLGİ KUTUSU -->
    <div id="fallbackBanner" class="hidden glass-panel border-amber-500/40 rounded-xl px-4 py-2.5 text-xs font-mono text-amber-200 flex items-center justify-between">
      <span id="fallbackBannerText"></span>
      <button onclick="document.getElementById('fallbackBanner').classList.add('hidden')" class="text-slate-400 hover:text-white ml-3">✕</button>
    </div>

    <!-- YÜKLENİYOR İSKELETİ -->
    <div id="loadingState" class="hidden glass-panel rounded-2xl p-12 text-center space-y-3">
      <div class="inline-block w-7 h-7 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
      <p id="loadingText" class="text-xs font-mono text-slate-400">Akademik dizin taranıyor...</p>
    </div>

    <!-- MAKALE AKIŞ LİSTESİ -->
    <div id="articlesList" class="space-y-3"></div>

    <!-- ALT SAYFALAMA VE KESİNTİSİZ AKIŞ -->
    <div id="paginationFooter" class="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <button 
        onclick="appendNextPage()" 
        class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 text-xs font-mono font-semibold transition">
        ➕ Sonraki Sayfayı Listeye Ekle (Kesintisiz Akış)
      </button>
      <div id="pageControls" class="flex items-center gap-1.5 font-mono text-xs"></div>
    </div>

  </main>

  <!-- 3. DERİN İNCELEME ÇEKMECESİ (SLIDE-OVER / BOTTOM SHEET INSPECTOR) -->
  <div id="inspectorBackdrop" onclick="closeInspector()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden"></div>
  <aside id="inspectorSheet" class="fixed inset-y-0 right-0 z-50 w-full max-w-2xl glass-panel border-l border-slate-700/80 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="px-5 py-4 border-b border-slate-800/90 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="sheetQuartile" class="text-[11px] font-mono font-bold px-2.5 py-0.5 rounded border">Q1</span>
        <span id="sheetHIndex" class="text-xs font-mono text-violet-300"></span>
      </div>
      <button onclick="closeInspector()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono">
        Kapat (ESC) ✕
      </button>
    </div>
    <div id="inspectorContent" class="p-5 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-5"></div>
  </aside>

  <!-- 4. TÜM Q1 DERGİLER KATALOĞU MODALI -->
  <div id="catalogModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel border border-slate-700 rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl">
      <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="text-sm sm:text-base font-bold text-white">🏛️ Küresel Q1 Psikoloji & Sinirbilim Dergi İndeksi</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Doğrudan derginin son sayılarını takip etmek için seçin.</p>
        </div>
        <button onclick="closeJournalCatalog()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-mono">✕</button>
      </div>
      <div class="p-3.5 border-b border-slate-800/80">
        <input id="catalogFilterInput" oninput="renderCatalogItems()" type="text" placeholder="Dergi adı ara (örn: Nature, Consulting, Cognition, Brain)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white font-mono focus:outline-none focus:border-cyan-400" />
      </div>
      <div id="catalogGrid" class="p-4 sm:p-5 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
    </div>
  </div>

  <!-- 5. MOBİL ALT NAVİGASYON BARI (Telefon Ergonomisi İçin) -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 glass-nav border-t border-slate-800/90 px-4 py-2 flex items-center justify-around text-[11px] font-mono">
    <button onclick="resetAllFilters()" class="flex flex-col items-center gap-0.5 text-cyan-400">
      <span>🧭</span>
      <span>Akış</span>
    </button>
    <button onclick="openJournalCatalog()" class="flex flex-col items-center gap-0.5 text-slate-300">
      <span>🏛️</span>
      <span>Dergiler</span>
    </button>
    <button onclick="toggleFilterPopover()" class="flex flex-col items-center gap-0.5 text-slate-300">
      <span>⚙️</span>
      <span>Filtre</span>
    </button>
    <button onclick="toggleVaultMode()" class="flex flex-col items-center gap-0.5 text-amber-300">
      <span>⭐</span>
      <span>Kasam</span>
    </button>
  </nav>

  <!-- BİLDİRİM TOAST -->
  <div id="toast" class="fixed bottom-16 md:bottom-6 right-5 z-50 hidden glass-panel border-cyan-500/50 text-cyan-200 px-4 py-2.5 rounded-xl text-xs font-mono shadow-2xl"></div>

  <script>
    // 1. TÜRKÇE -> İNGİLİZCE AKADEMİK PSİKOLOJİ KAVRAM KÖPRÜSÜ
    // Kullanıcı Türkçe arama yaptığında OpenAlex'in sıfır sonuç döndürmesini önler
    const TR_EN_DICTIONARY = {
      'üstbiliş': 'metacognition',
      'üst biliş': 'metacognition',
      'bağlanma': 'attachment style',
      'travma': 'psychological trauma ptsd',
      'depresyon': 'depression major depressive disorder',
      'anksiyete': 'anxiety disorder',
      'kaygı': 'anxiety',
      'bilişsel çarpıtma': 'cognitive distortion',
      'şema terapi': 'schema therapy',
      'çalışma belleği': 'working memory',
      'yürütücü işlevler': 'executive function',
      'ahlaki ikilem': 'moral dilemma moral decision making',
      'ahlak': 'moral psychology',
      'karar verme': 'decision making',
      'yapay zeka': 'artificial intelligence',
      'tükenmişlik': 'burnout',
      'özşefkat': 'self-compassion',
      'öz şefkat': 'self-compassion',
      'duygu düzenleme': 'emotion regulation',
      'empati': 'empathy',
      'kişilik bozukluğu': 'personality disorder',
      'sınırda kişilik': 'borderline personality disorder',
      'otizm': 'autism spectrum disorder',
      'dikkat eksikliği': 'adhd attention deficit',
      'şizofreni': 'schizophrenia',
      'bipolar': 'bipolar disorder',
      'obsesif': 'obsessive compulsive disorder ocd',
      'önyargı': 'prejudice intergroup',
      'sosyal kimlik': 'social identity theory',
      'nörogörüntüleme': 'neuroimaging fmri',
      'psikoterapi': 'psychotherapy',
      'bilişsel davranışçı': 'cognitive behavioral therapy cbt'
    };

    // 2. KANONİK ISSN-L DESTEKLİ PSİKOLOJİ VE Q1 DERGİ VERİTABANI
    const PSYCH_DOMAINS = [
      {
        id: 'elite_all',
        name: '🌟 Genel Elit Psikoloji',
        conceptId: 'C15744967',
        journals: [
          { name: 'Behavioral and Brain Sciences', issn: '0140-525X' },
          { name: 'Annual Review of Psychology', issn: '0066-4308' },
          { name: 'Psychological Bulletin', issn: '0033-2909' },
          { name: 'Psychological Review', issn: '0033-295X' },
          { name: 'Nature Human Behaviour', issn: '2397-3374' },
          { name: 'Trends in Cognitive Sciences', issn: '1364-6613' },
          { name: 'Psychological Science', issn: '0956-7976' },
          { name: 'Perspectives on Psychological Science', issn: '1745-6916' },
          { name: 'American Psychologist', issn: '0003-066X' },
          { name: 'Current Directions in Psychological Science', issn: '0963-7214' }
        ]
      },
      {
        id: 'clinical',
        name: 'Klinik Psikoloji',
        conceptId: 'C70410870',
        journals: [
          { name: 'World Psychiatry', issn: '1723-8617' },
          { name: 'JAMA Psychiatry', issn: '2168-622X' },

    // 3. BAŞLANGIÇ KURULUMU
    function initApp() {
      updateVaultBadge();
      renderDomainStrip();
      renderJournalStrip();
      resetAndFetch();

      document.getElementById('searchInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          hideAutocomplete();
          triggerNewSearch();
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#searchInput') && !e.target.closest('#autocompleteDropdown')) {
          hideAutocomplete();
        }
      });

      window.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName?.toLowerCase();
        if (e.key === 'Escape') {
          closeInspector();
          closeJournalCatalog();
          hideAutocomplete();
        }
        if (tag !== 'input' && tag !== 'select' && !isVaultMode) {
          if (e.key === '[') stepJournal(-1);
          if (e.key === ']') stepJournal(1);
        }
      });
    }

    // 4. DİSİPLİN VE Q1 DERGİ ŞERİDİ KONTROLLERİ
    function renderDomainStrip() {
      const el = document.getElementById('domainStrip');
      el.innerHTML = PSYCH_DOMAINS.map(d => {
        const active = !isVaultMode && d.id === activeDomain.id;
        return `
          <button 
            onclick="selectDomain('${d.id}')"
            class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${
              active 
                ? 'bg-cyan-500/20 text-cyan-200 border-cyan-500/50 shadow-sm shadow-cyan-500/10' 
                : 'bg-slate-900/70 text-slate-400 hover:text-slate-200 border-slate-800/90'
            }">
            ${d.name}
          </button>
        `;
      }).join('');
    }

    function selectDomain(id) {
      isVaultMode = false;
      snowballSourceTitle = null;
      activeDomain = PSYCH_DOMAINS.find(d => d.id === id) || PSYCH_DOMAINS[0];
      activeJournal = null;
      renderDomainStrip();
      renderJournalStrip();
      resetAndFetch();
    }

    function renderJournalStrip() {
      const strip = document.getElementById('journalStrip');
      const label = document.getElementById('activeVenueLabel');
      const officialLink = document.getElementById('venueOfficialLink');

      if (activeJournal) {
        label.textContent = `${activeJournal.name} (${activeJournal.issn})`;
        updateOfficialJournalLink(activeJournal.issn);
      } else {
        label.textContent = `${activeDomain.name} — Tüm Q1 Dergi Havuzu (${activeDomain.journals.length} Dergi)`;
        officialLink.classList.add('hidden');
      }

      const isPool = activeJournal === null;
      let html = `
        <button 
          onclick="selectJournal(null)"
          class="px-3 py-1 rounded-lg text-[11px] font-mono whitespace-nowrap border transition ${
            isPool 
              ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 font-semibold' 
              : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
          }">
          Tüm Q1 Havuzu
        </button>
      `;

      activeDomain.journals.forEach((j, idx) => {
        const selected = activeJournal && activeJournal.issn === j.issn;
        html += `
          <button 
            onclick="selectJournal(${idx})"
            class="px-3 py-1 rounded-lg text-[11px] font-mono whitespace-nowrap border transition ${
              selected 
                ? 'bg-emerald-500/25 text-emerald-200 border-emerald-400 font-semibold' 
                : 'bg-slate-900/80 text-slate-300 border-slate-800/90 hover:border-cyan-500/40 hover:text-cyan-200'
            }">
            ★ ${j.name}
          </button>
        `;
      });

      strip.innerHTML = html;
    }

    function selectJournal(idx) {
      isVaultMode = false;
      snowballSourceTitle = null;
      activeJournal = (idx === null || idx < 0) ? null : activeDomain.journals[idx];
      renderJournalStrip();
      resetAndFetch();
    }

    function stepJournal(dir) {
      const list = activeDomain.journals;
      let idx = activeJournal ? list.findIndex(j => j.issn === activeJournal.issn) : -1;
      let next = idx + dir;
      if (next >= list.length) next = -1;
      if (next < -1) next = list.length - 1;
      selectJournal(next === -1 ? null : next);
    }

    async function updateOfficialJournalLink(issn) {
      const linkEl = document.getElementById('venueOfficialLink');
      if (sourceCache[issn]?.homepage_url) {
        linkEl.href = sourceCache[issn].homepage_url;
        linkEl.classList.remove('hidden');
        return;
      }
      try {
        const res = await fetch(`https://api.openalex.org/sources?filter=issn:${encodeURIComponent(issn)}&per-page=1`);
        const data = await res.json();
        const src = data.results?.[0];
        if (src) {
          sourceCache[issn] = {
            h_index: src.summary_stats?.h_index || 0,
            impact_2yr: src.summary_stats?.['2yr_mean_citedness'] || 0,
            homepage_url: src.homepage_url || null
          };
          if (src.homepage_url) {
            linkEl.href = src.homepage_url;
            linkEl.classList.remove('hidden');
          }
        }
      } catch (e) {}
    }

    // 5. SCHOLAR KÜRESEL ARAMA, CANLI AUTOCOMPLETE VE AKILLI KURTARMA (SMART FALLBACK)

      searchScope = searchScope === 'scholar_global' ? 'contextual' : 'scholar_global';
      const icon = document.getElementById('searchScopeIcon');
      const text = document.getElementById('searchScopeText');

        btn.className = 'px-3 py-2 text-[11px] font-mono border-r border-slate-800 bg-violet-500/15 text-violet-300 hover:bg-violet-500/25 transition shrink-0 flex items-center gap-1';
        showToast('🎯 Bağlamsal Mod: Sadece seçili alt dal veya dergi içinde arar.');
      }
      if (document.getElementById('searchInput').value.trim().length > 0) {
        triggerNewSearch();
      }
    }

    function translateQueryIfNeeded(rawQuery) {
      let q = rawQuery.trim();
      const lower = q.toLowerCase();
      if (TR_EN_DICTIONARY[lower]) {
        return TR_EN_DICTIONARY[lower];
      }
      for (const [trTerm, enTerm] of Object.entries(TR_EN_DICTIONARY)) {
        if (lower.includes(trTerm)) {
          q = lower.replace(trTerm, enTerm);
          break;
        }
      }
      return q;
    }

    function handleSearchTyping() {
      const val = document.getElementById('searchInput').value.trim();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);

      // Ekrandaki mevcut makalelerde anında kelime vurgulama yap
      applyClientFilters();

      clearTimeout(typingTimer);
      if (val.length < 3) {
        hideAutocomplete();
        return;
      }
      typingTimer = setTimeout(() => fetchAutocompleteSuggestions(val), 240);
    }

    async function fetchAutocompleteSuggestions(query) {
      const translated = translateQueryIfNeeded(query);
      try {
        const res = await fetch(`https://api.openalex.org/autocomplete/works?q=${encodeURIComponent(translated)}`);
        const data = await res.json();
        const items = (data.results || []).slice(0, 5);
        const drop = document.getElementById('autocompleteDropdown');

        if (items.length === 0) {
          hideAutocomplete();
          return;
        }

        drop.innerHTML = `
          <div class="px-3 py-1.5 bg-slate-950/90 text-[10px] font-mono text-cyan-400 flex items-center justify-between">
            <span>🔍 "${escapeHtml(query)}" için hızlı eşleşmeler (Tüm sonuçlar için Enter'a basın)</span>
            ${translated !== query.trim() ? `<span class="text-amber-300">TR➔EN: ${escapeHtml(translated)}</span>` : ''}
          </div>
        ` + items.map(it => `
          <button 
            onclick="selectAutocompleteWork('${escapeHtml(it.display_name).replace(/'/g, "\\'")}')"
            class="w-full text-left px-3.5 py-2 hover:bg-slate-800/80 transition flex items-center justify-between gap-2">
            <span class="text-xs text-slate-200 line-clamp-1">${escapeHtml(it.display_name)}</span>
            <span class="text-[10px] font-mono text-slate-500 shrink-0">${escapeHtml(it.hint || 'Makale')}</span>
          </button>
        `).join('');

        drop.classList.remove('hidden');
      } catch (e) {
        hideAutocomplete();
      }
    }

    function selectAutocompleteWork(title) {
      document.getElementById('searchInput').value = title;
      hideAutocomplete();
      triggerNewSearch();
    }

    function hideAutocomplete() {
      document.getElementById('autocompleteDropdown').classList.add('hidden');
    }

    function triggerNewSearch() {
      snowballSourceTitle = null;
      const q = document.getElementById('searchInput').value.trim();
      if (q.length > 0) {
        // Arama yapıldığında Scholar gibi BM25 Alaka Düzeyine geç
        document.getElementById('sortSelect').value = 'relevance_score:desc';
      } else {
        document.getElementById('sortSelect').value = 'publication_date:desc';
      }
      resetAndFetch();
    }

    function clearSearchInput() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('sortSelect').value = 'publication_date:desc';
      snowballSourceTitle = null;
      hideAutocomplete();
      resetAndFetch();
    }

    // 6. ANA OPENALEX SORGUSU VE AKILLI SIFIR SONUÇ KURTARICI
    function resetAndFetch() {
      currentPage = 1;
      document.getElementById('fallbackBanner').classList.add('hidden');
      fetchArticles(false, false);
    }

    function goToPage(p) {
      if (p < 1) return;
      currentPage = p;
      fetchArticles(false, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function appendNextPage() {
      currentPage += 1;
      fetchArticles(true, false);
    }

    async function fetchArticles(appendMode = false, isFallbackRetry = false) {
      if (isVaultMode) {
        renderVaultArticles();
        return;
      }

      const loader = document.getElementById('loadingState');
      const listEl = document.getElementById('articlesList');
      loader.classList.remove('hidden');
      if (!appendMode) listEl.innerHTML = '';

      const rawQuery = document.getElementById('searchInput').value.trim();
      const effectiveQuery = translateQueryIfNeeded(rawQuery);
      const hasSearch = effectiveQuery.length > 0;

      const sortVal = document.getElementById('sortSelect').value;
      const yearVal = document.getElementById('yearSelect').value;
      const oaOnly = document.getElementById('oaToggle').checked;
      const hideFuture = document.getElementById('hideFutureToggle').checked;

      // Makale, Derleme (Review) ve Ön Baskıları dahil et (Meta-analizleri kaçırmamak için)
      let filters = ['type:article|review'];

      if (isFallbackRetry) {
        // Akıllı Kurtarma Modu: Dergi ve Yıl kısıtlamalarını tamamen gevşet
      } else if (hasSearch && searchScope === 'scholar_global') {
        // VARSAYILAN SCHOLAR KÜRESEL MOD:
        // Kullanıcı bir kelime arattığında dergi/yıl dar boğazına takılmadan tüm literatürde arar
      } else {
        // Dergi veya Alt Dal Keşif Modu
        if (activeJournal) {
          filters.push(`primary_location.source.issn:${activeJournal.issn}`);
        } else {
          const issnList = activeDomain.journals.map(j => j.issn).join('|');
          filters.push(`primary_location.source.issn:${issnList}`);
        }
        if (yearVal !== 'all') {
          filters.push(`publication_year:${yearVal}`);
        }
      }

      if (oaOnly) filters.push('is_oa:true');
      if (hideFuture) {
        const today = new Date().toISOString().split('T')[0];
        filters.push(`to_publication_date:${today}`);
      }

      let url = `https://api.openalex.org/works?filter=${encodeURIComponent(filters.join(','))}&sort=${encodeURIComponent(sortVal)}&per-page=25&page=${currentPage}`;
      if (hasSearch) {
        url += `&search=${encodeURIComponent(effectiveQuery)}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        const works = data.results || [];
        totalWorksCount = data.meta?.count || works.length;

        // EĞER DAR FİLTREDE 0 SONUÇ ÇIKTIYSA OTOMATİK SCHOLAR FALLBACK ÇALIŞTIR
        if (works.length === 0 && !isFallbackRetry && (hasSearch || activeJournal || yearVal !== 'all')) {
          const banner = document.getElementById('fallbackBanner');
          document.getElementById('fallbackBannerText').textContent = 
            `⚡ Dar filtrede eşleşme bulunamadı; kısıtlamalar esnetilerek Küresel Scholar sonuçları getirildi.`;
          banner.classList.remove('hidden');
          await fetchArticles(false, true);
          return;
        }

        // Dergi H-Index metriklerini toplu çek
        const missingIds = [...new Set(
          works
            .map(w => w.primary_location?.source?.id)
            .filter(id => id && !sourceCache[id])
            .map(id => id.replace('https://openalex.org/', ''))
        )];

        if (missingIds.length > 0) {
          const sRes = await fetch(`https://api.openalex.org/sources?filter=openalex_id:${missingIds.slice(0, 35).join('|')}&per-page=35`);
          const sData = await sRes.json();
          (sData.results || []).forEach(src => {
            const info = {
              h_index: src.summary_stats?.h_index || 0,
              impact_2yr: src.summary_stats?.['2yr_mean_citedness'] || 0,
              homepage_url: src.homepage_url || null
            };
            sourceCache[src.id] = info;
            if (src.issn_l) sourceCache[src.issn_l] = info;
          });
        }

        const enriched = works
          .filter(w => !/^(correction to|erratum|corrigendum)/i.test(w.title || ''))
          .map(w => processWork(w));

        enriched.forEach(a => articleMap.set(a.id, a));

        if (appendMode) {
          const seen = new Set(currentArticles.map(x => x.id));
          enriched.forEach(a => { if (!seen.has(a.id)) currentArticles.push(a); });
        } else {
          currentArticles = enriched;
        }

        loader.classList.add('hidden');
        renderStatusBreadcrumbs(rawQuery, effectiveQuery);
        applyClientFilters();
        renderPagination();

      } catch (err) {
        loader.classList.add('hidden');
        listEl.innerHTML = `
          <div class="glass-panel rounded-2xl p-8 text-center text-xs font-mono text-red-300">
            Bağlantı hatası: ${escapeHtml(err.message)}. Lütfen tekrar deneyin.
          </div>
        `;
      }
    }

    // 7. KARTOPU KEŞİF (SNOWBALLING: ATIF YAPANLAR & İLGİLİ ÇALIŞMALAR)
    async function fetchSnowballWorks(workId, mode, title) {
      closeInspector();
      isVaultMode = false;
      const shortId = workId.replace('https://openalex.org/', '');
      snowballSourceTitle = `${mode === 'cites' ? 'Atıf Yapanlar' : 'Benzer Çalışmalar'}: "${title.slice(0, 45)}..."`;

      const loader = document.getElementById('loadingState');
      loader.classList.remove('hidden');
      document.getElementById('articlesList').innerHTML = '';

      const filterStr = mode === 'cites' ? `cites:${shortId}` : `related_to:${shortId}`;
      const url = `https://api.openalex.org/works?filter=${encodeURIComponent(filterStr)}&sort=cited_by_count:desc&per-page=25`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const works = (data.results || []).map(w => processWork(w));
        works.forEach(a => articleMap.set(a.id, a));
        currentArticles = works;
        totalWorksCount = data.meta?.count || works.length;
        loader.classList.add('hidden');
        renderStatusBreadcrumbs('', '');
        applyClientFilters();
      } catch (e) {
        loader.classList.add('hidden');
      }
    }

    // 8. VERİ ZENGİNLEŞTİRME
    function processWork(w) {
      const absText = cleanXml(rebuildAbstract(w.abstract_inverted_index));
      const src = w.primary_location?.source || {};
      const srcId = src.id;
      const issn = src.issn_l || (src.issn ? src.issn[0] : '');
      const journalName = src.display_name || activeJournal?.name || 'Akademik Yayın';

      const metrics = (srcId && sourceCache[srcId]) || (issn && sourceCache[issn]) || { h_index: null, impact_2yr: 0, homepage_url: null };
      const isFlagship = (issn && PRESTIGE_ISSNS.has(issn)) || PRESTIGE_NAMES.has(journalName.toLowerCase());

      let quartile = 'Q2 / İndeksli';
      let qStyle = 'bg-slate-800 text-slate-300 border-slate-700';

      if (isFlagship || metrics.impact_2yr >= 3.5 || (metrics.h_index && metrics.h_index >= 110)) {
        quartile = 'Q1 ELITE';
        qStyle = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
      } else if (metrics.impact_2yr >= 2.0 || (metrics.h_index && metrics.h_index >= 65)) {
        quartile = 'Q1';
        qStyle = 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40';
      }

      const combined = `${w.title || ''} ${absText}`.toLowerCase();
      const methods = [];
      if (/meta-analys|meta analys|systematic review|prisma/.test(combined)) methods.push('Meta-Analiz / Derleme');
      if (/randomized controlled|rct|experiment|placebo|double-blind/.test(combined)) methods.push('Deneysel / RKÇ');
      if (/fmri|eeg|erp|neuroimaging|bold signal|prefrontal|amygdala/.test(combined)) methods.push('Nörogörüntüleme');
      if (/longitudinal|prospective cohort|follow-up/.test(combined)) methods.push('Boylamasına');
      if (/psychometric|confirmatory factor|cronbach|item response|scale/.test(combined)) methods.push('Psikometri / Ölçek');
      if (methods.length === 0) methods.push('Araştırma');

      return {
        id: w.id,
        title: cleanXml(w.title || 'Başlıksız Çalışma'),
        pubDate: w.publication_date || `${w.publication_year || ''}`,
        pubYear: w.publication_year || '',
        journalName,
        issn,
        hIndex: metrics.h_index,
        impact2yr: metrics.impact_2yr ? metrics.impact_2yr.toFixed(2) : null,
        homepageUrl: metrics.homepage_url,
        quartile,
        qStyle,
        citations: w.cited_by_count || 0,
        isOA: w.open_access?.is_oa || false,
        oaUrl: w.open_access?.oa_url || w.doi || '#',
        doi: w.doi || '',
        authors: (w.authorships || []).slice(0, 4).map(a => a.author?.display_name).filter(Boolean),
        totalAuthors: (w.authorships || []).length,
        abstractText: absText,
        hasRealAbstract: Boolean(w.abstract_inverted_index),
        methods
      };
    }

    function rebuildAbstract(inv) {
      if (!inv) return 'Tam metin ve özet detayları için doğrudan yayıncı (DOI) bağlantısını açabilirsiniz.';
      const arr = [];
      for (const [word, posList] of Object.entries(inv)) {
        for (const p of posList) arr[p] = word;
      }
      return arr.join(' ');
    }

    function cleanXml(str) {
      return String(str).replace(/<[^>]+>/g, ' ').replace(/^Abstract[:\s]*/i, '').replace(/\s+/g, ' ').trim();
    }

    // 9. ARAMA KELİMESİ VURGULAMA (HIGHLIGHTING)
    function getHighlightTokens() {
      const raw = document.getElementById('searchInput').value.trim();
      if (!raw) return [];
      const translated = translateQueryIfNeeded(raw);
      const combined = `${raw} ${translated}`;
      return [...new Set(
        combined
          .split(/\s+/)
          .map(s => s.replace(/["']/g, '').trim())
          .filter(s => s.length >= 2 && !['and', 'or', 'the', 'for'].includes(s.toLowerCase()))
      )];
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlightText(text) {
      const safe = escapeHtml(text || '');
      const tokens = getHighlightTokens();
      if (tokens.length === 0) return { html: safe, count: 0 };

      const pattern = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      const rx = new RegExp(`(${pattern})`, 'gi');
      let count = 0;
      const html = safe.replace(rx, (m) => {
        count++;
        return `<mark class="search-hl">${m}</mark>`;
      });
      return { html, count };
    }

    // 10. MİNİMALİST KART VE KOMPAKT LİSTE RENDER MOTORU
    function toggleDensityMode() {
      isCompactMode = !isCompactMode;
      document.getElementById('densityBtn').textContent = isCompactMode
        ? '☰ Görünüm: Kompakt Liste'
        : '☰ Görünüm: Standart Kart';
      applyClientFilters();
    }

    function renderStatusBreadcrumbs(rawQ, transQ) {
      const box = document.getElementById('activeBreadcrumbs');
      let pills = [];

      if (snowballSourceTitle) {
        pills.push(`<span class="px-2.5 py-0.5 rounded-lg bg-violet-500/20 text-violet-200 border border-violet-500/40">🕸️ ${escapeHtml(snowballSourceTitle)} <button onclick="resetAllFilters()" class="ml-1 text-white">✕</button></span>`);
      }
      if (rawQ) {
        const label = transQ !== rawQ ? `"${rawQ}" (➔ ${transQ})` : `"${rawQ}"`;
        pills.push(`<span class="px-2.5 py-0.5 rounded-lg bg-cyan-500/20 text-cyan-200 border border-cyan-500/40">🔍 Arama: ${escapeHtml(label)} <button onclick="clearSearchInput()" class="ml-1 text-white">✕</button></span>`);
      }
      if (activeJournal && (!rawQ || searchScope === 'contextual')) {
        pills.push(`<span class="px-2.5 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-200 border border-emerald-500/40">🏛️ ${escapeHtml(activeJournal.name)} <button onclick="selectJournal(null)" class="ml-1 text-white">✕</button></span>`);
      }

      box.innerHTML = pills.join('');
    }

    function applyClientFilters() {
      const methodVal = document.getElementById('methodSelect').value;
      const base = isVaultMode ? vaultList : currentArticles;

      const filtered = base.filter(a => {
        if (methodVal !== 'ALL' && !a.methods.includes(methodVal)) return false;
        return true;
      });

      document.getElementById('resultCountText').textContent = isVaultMode
        ? `Kasada ${filtered.length} kayıt`
        : `Sayfa ${currentPage} • ${filtered.length} gösterilen (Toplam: ${totalWorksCount.toLocaleString('tr-TR')})`;

      renderArticles(filtered);
    }

    function renderArticles(articles) {
      const container = document.getElementById('articlesList');
      if (articles.length === 0) {
        container.innerHTML = `
          <div class="glass-panel rounded-2xl p-10 text-center space-y-3">
            <p class="text-sm font-medium text-slate-200">Eşleşen çalışma bulunamadı.</p>
            <button onclick="resetAllFilters()" class="px-4 py-2 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-xs font-mono">
              Tüm Filtreleri Sıfırla
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = articles.map(art => {
        const titleHL = highlightText(art.title);
        const absHL = highlightText(art.abstractText);
        const totalHits = titleHL.count + absHL.count;
        const saved = vaultList.some(v => v.id === art.id);

        // KOMPAKT TARAMA MODU (Maksimum Minimalizm)
        if (isCompactMode) {
          return `
            <article onclick="openInspector('${art.id}')" class="glass-card rounded-xl px-4 py-3 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div class="space-y-1 min-w-0 flex-1">
                <div class="flex items-center gap-2 text-[11px] font-mono">
                  <span class="px-2 py-0.2 rounded border font-semibold ${art.qStyle}">${art.quartile}</span>
                  <span class="text-cyan-300 truncate">${escapeHtml(art.journalName)}</span>
                  <span class="text-slate-500">• ${art.pubDate}</span>
                </div>
                <h2 class="text-sm font-semibold text-white truncate">${titleHL.html}</h2>
              </div>
              <div class="flex items-center gap-2 font-mono text-[11px] shrink-0">
                ${art.hIndex ? `<span class="text-violet-300">H:${art.hIndex}</span>` : ''}
                <span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300">Atıf: ${art.citations}</span>
              </div>
            </article>
          `;
        }

        // STANDART MİNİMALİST KART MODU (Sadece İlk Görmek İstediğin Çekirdek Metrikler)
        return `
          <article class="glass-card rounded-2xl p-4 sm:p-5 space-y-3">
            
            <!-- ÜST BAR: 1. Q1 Durumu, 2. Dergi Adı, 3. Dergi H-Index, 4. Atıf Sayısı, 5. Tarih -->
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/70 pb-2.5 text-[11px] font-mono">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2 py-0.5 rounded-md border font-semibold ${art.qStyle}">
                  ${art.quartile}
                </span>
                <span class="text-cyan-300 font-semibold">
                  ${escapeHtml(art.journalName)}
                </span>
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                ${totalHits > 0 ? `
                  <span class="px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-200 border border-cyan-400/40 font-semibold">
                    🔍 ${totalHits} Eşleşme
                  </span>
                ` : ''}
                ${art.hIndex ? `
                  <span class="px-2 py-0.5 rounded-md bg-violet-500/15 text-violet-300 border border-violet-500/30">
                    H-Index: <strong>${art.hIndex}</strong>
                  </span>
                ` : ''}
                <span class="px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-300 border border-amber-500/30">
                  Atıf: <strong>${art.citations}</strong>
                </span>
                <span class="px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800">
                  ${art.pubDate}
                </span>
              </div>
            </div>

            <!-- BAŞLIK VE YAZARLAR -->
            <div>
              <h2 onclick="openInspector('${art.id}')" class="text-base font-bold text-white hover:text-cyan-300 transition cursor-pointer leading-snug">
                ${titleHL.html}
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                ${escapeHtml(art.authors.join(', '))}${art.totalAuthors > 4 ? ` +${art.totalAuthors - 4}` : ''}
              </p>
            </div>

            <!-- KISA ÖZET ÖNİZLEMESİ -->
            <p onclick="openInspector('${art.id}')" class="text-xs text-slate-300/90 leading-relaxed ${totalHits > 0 ? 'line-clamp-4' : 'line-clamp-2'} cursor-pointer hover:text-slate-200">
              ${absHL.html}
            </p>

            <!-- ALT MİNİMAL BAR: Metodoloji Etiketi & Hızlı Aksiyonlar -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-[11px] font-mono">
              <div class="flex flex-wrap items-center gap-1.5">
                ${art.methods.map(m => `<span class="px-2 py-0.5 rounded bg-slate-900/90 text-slate-400 border border-slate-800">${m}</span>`).join('')}
                ${art.isOA ? `<span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">Açık Erişim PDF</span>` : ''}
              </div>

              <div class="flex items-center gap-1.5">
                <button onclick="toggleVaultItem('${art.id}')" class="px-2.5 py-1 rounded-lg border transition ${saved ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-900 hover:bg-slate-800 text-slate-400 border-slate-800'}">
                  ${saved ? '⭐ Kayıtlı' : '☆ Kaydet'}
                </button>
                <button onclick="openInspector('${art.id}')" class="px-3 py-1 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 transition">
                  İncele & Atıf →
                </button>
                ${art.oaUrl && art.oaUrl !== '#' ? `
                  <a href="${art.oaUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition">
                    DOI ↗
                  </a>
                ` : ''}
              </div>
            </div>

          </article>
        `;
      }).join('');
    }

    // 11. DERİN İNCELEME ÇEKMECESİ (TÜM DETAYLAR BURADA TOPLANIR)
    function openInspector(id) {
      const art = articleMap.get(id) || vaultList.find(v => v.id === id);
      if (!art) return;

      document.getElementById('sheetQuartile').className = `text-[11px] font-mono font-bold px-2.5 py-0.5 rounded border ${art.qStyle}`;
      document.getElementById('sheetQuartile').textContent = art.quartile;
      document.getElementById('sheetHIndex').textContent = `${art.journalName} • H-Index: ${art.hIndex || 'N/A'}`;

      const seg = segmentAbstractText(art.abstractText);
      const content = document.getElementById('inspectorContent');

      content.innerHTML = `
        <div class="space-y-4">
          <div class="text-xs font-mono text-slate-400">${art.pubDate} • Atıf: <strong class="text-amber-300">${art.citations}</strong> ${art.impact2yr ? `• 2yr IF: <strong class="text-cyan-300">${art.impact2yr}</strong>` : ''}</div>
          <h3 class="text-lg font-bold text-white leading-snug">${highlightText(art.title).html}</h3>
          <p class="text-xs text-slate-300">${escapeHtml(art.authors.join(', '))}</p>

          <!-- Yapılandırılmış Özet -->
          <div class="space-y-2.5 pt-2">
            <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Bölümlendirilmiş Özet</span>
            <div class="border-l-2 border-cyan-400 bg-slate-900/70 pl-3.5 py-2.5 pr-3 rounded-r-xl">
              <span class="text-[10px] font-mono uppercase text-cyan-300 block mb-1">🎯 Amaç & Arka Plan</span>
              <p class="text-xs text-slate-200 leading-relaxed">${highlightText(seg.bg).html}</p>
            </div>
            ${seg.method ? `
              <div class="border-l-2 border-violet-400 bg-slate-900/70 pl-3.5 py-2.5 pr-3 rounded-r-xl">
                <span class="text-[10px] font-mono uppercase text-violet-300 block mb-1">⚙️ Yöntem & Analiz</span>
                <p class="text-xs text-slate-200 leading-relaxed">${highlightText(seg.method).html}</p>
              </div>
            ` : ''}
            ${seg.res ? `
              <div class="border-l-2 border-emerald-400 bg-slate-900/70 pl-3.5 py-2.5 pr-3 rounded-r-xl">
                <span class="text-[10px] font-mono uppercase text-emerald-300 block mb-1">📊 Bulgular & Sonuç</span>
                <p class="text-xs text-slate-200 leading-relaxed">${highlightText(seg.res).html}</p>
              </div>
            ` : ''}
          </div>

          <!-- Kartopu Keşif (Snowballing) Butonları -->
          <div class="pt-3 border-t border-slate-800 space-y-2">
            <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400 block">Kartopu Literatür Keşfi (Snowballing)</span>
            <div class="flex flex-wrap gap-2">
              <button onclick="fetchSnowballWorks('${art.id}', 'cites', '${art.title.replace(/'/g, "\\'")}')" class="px-3 py-2 rounded-xl bg-violet-500/15 hover:bg-violet-500/25 text-violet-200 border border-violet-500/30 text-xs font-mono transition">
                🕸️ Bu Makaleye Atıf Yapan Çalışmaları Gör (${art.citations})
              </button>
              <button onclick="fetchSnowballWorks('${art.id}', 'related', '${art.title.replace(/'/g, "\\'")}')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono transition">
                🔗 Kavramsal Benzer Çalışmalar
              </button>
            </div>
          </div>

          <!-- Dışa Aktarım ve Tam Metin -->
          <div class="pt-3 border-t border-slate-800 flex flex-wrap gap-2 font-mono text-xs">
            <button onclick="copyAPA('${art.id}')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200">📋 APA 7 Kopyala</button>
            <button onclick="copyObsidian('${art.id}')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300">📝 Obsidian (.md)</button>
            ${art.doi ? `<a href="${art.doi}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-semibold">Makaleye Git (DOI) ↗</a>` : ''}
          </div>
        </div>
      `;

      document.getElementById('inspectorBackdrop').classList.remove('hidden');
      document.getElementById('inspectorSheet').classList.remove('translate-x-full');
    }

    function closeInspector() {
      document.getElementById('inspectorBackdrop').classList.add('hidden');
      document.getElementById('inspectorSheet').classList.add('translate-x-full');
    }

    function segmentAbstractText(t) {
      const s = t.split(/(?<=[.!?])\s+/);
      if (s.length <= 3) return { bg: t, method: null, res: null };
      const k = Math.ceil(s.length / 3);
      return { bg: s.slice(0, k).join(' '), method: s.slice(k, k * 2).join(' '), res: s.slice(k * 2).join(' ') };
    }

    // 12. YARDIMCI FONKSİYONLAR (SAYFALAMA, KATALOG, KASA, KOPYALAMA)
    function renderPagination() {
      const maxP = Math.min(400, Math.ceil(totalWorksCount / 25) || 1);
      document.getElementById('pageControls').innerHTML = `
        <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 disabled:opacity-40">«</button>
        <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 disabled:opacity-40">‹ Önceki</button>
        <span class="px-3 py-1.5 rounded-lg bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">${currentPage} / ${maxP}</span>
        <button onclick="goToPage(${currentPage + 1})" ${currentPage >= maxP ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 disabled:opacity-40">Sonraki ›</button>
      `;
    }

    function toggleFilterPopover() {
      document.getElementById('filterPopover').classList.toggle('hidden');
    }

    function openJournalCatalog() {
      document.getElementById('catalogModal').classList.remove('hidden');
      renderCatalogItems();
    }

    function closeJournalCatalog() {
      document.getElementById('catalogModal').classList.add('hidden');
    }

    function renderCatalogItems() {
      const q = (document.getElementById('catalogFilterInput').value || '').toLowerCase().trim();
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = PSYCH_DOMAINS.map(d => {
        const list = d.journals.filter(j => !q || j.name.toLowerCase().includes(q));
        if (list.length === 0) return '';
        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <h4 class="text-xs font-mono font-bold text-cyan-300 border-b border-slate-800 pb-1.5">${d.name}</h4>
            <div class="flex flex-wrap gap-1.5">
              ${list.map(j => `
                <button onclick="pickFromCatalog('${d.id}', '${j.issn}')" class="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-slate-950 hover:bg-emerald-500/20 text-slate-300 hover:text-emerald-200 border border-slate-800 transition text-left">
                  ★ ${j.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function pickFromCatalog(domId, issn) {
      closeJournalCatalog();
      isVaultMode = false;
      activeDomain = PSYCH_DOMAINS.find(d => d.id === domId) || PSYCH_DOMAINS[0];
      const idx = activeDomain.journals.findIndex(j => j.issn === issn);
      renderDomainStrip();
      selectJournal(idx >= 0 ? idx : null);
    }

    function toggleVaultItem(id) {
      const idx = vaultList.findIndex(v => v.id === id);
      if (idx > -1) {
        vaultList.splice(idx, 1);
        showToast('Kasadan çıkarıldı.');
      } else {
        const art = articleMap.get(id);
        if (art) {
          vaultList.unshift(art);
          showToast('⭐ Makale kasaya kaydedildi.');
        }
      }
      localStorage.setItem('psychnexus_vault_v3', JSON.stringify(vaultList));
      updateVaultBadge();
      applyClientFilters();
    }

    function updateVaultBadge() {
      document.getElementById('vaultBadge').textContent = vaultList.length;
    }

    function toggleVaultMode() {
      isVaultMode = !isVaultMode;
      renderDomainStrip();
      if (isVaultMode) {
        renderVaultArticles();
      } else {
        resetAndFetch();
      }
    }

    function renderVaultArticles() {
      vaultList.forEach(a => articleMap.set(a.id, a));
      applyClientFilters();
    }

    function resetAllFilters() {
      isVaultMode = false;
      snowballSourceTitle = null;
      activeJournal = null;
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('methodSelect').value = 'ALL';
      document.getElementById('sortSelect').value = 'publication_date:desc';
      renderDomainStrip();
      renderJournalStrip();
      resetAndFetch();
    }

    function copyAPA(id) {
      const art = articleMap.get(id);
      if (!art) return;
      const authors = art.authors.length > 0 ? art.authors.join(', ') : 'Yazar Belirtilmemiş';
      navigator.clipboard.writeText(`${authors} (${art.pubYear}). ${art.title}. ${art.journalName}. ${art.doi}`);
      showToast('📋 APA 7 atıf kopyalandı!');
    }

    function copyObsidian(id) {
      const art = articleMap.get(id);
      if (!art) return;
      const md = `---
title: "${art.title.replace(/"/g, '\\"')}"
authors: [${art.authors.map(a => `"${a}"`).join(', ')}]
journal: "${art.journalName}"
year: ${art.pubYear}
quartile: "${art.quartile}"
journal_h_index: ${art.hIndex || 0}
citations: ${art.citations}
doi: "${art.doi}"
tags:
  - literature-note
  - psychology/${activeDomain.id}
---

# ${art.title}

- **Dergi:** ${art.journalName} (${art.quartile} | H-Index: ${art.hIndex || 'N/A'})
- **Yıl:** ${art.pubDate} | **Atıf:** ${art.citations}
- **DOI:** ${art.doi}

## Özet
${art.abstractText}
`;
      navigator.clipboard.writeText(md);
      showToast('📝 Obsidian (.md) notu kopyalandı!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
