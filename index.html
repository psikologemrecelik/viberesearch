<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>VibePsych</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Newsreader"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-base: #050609;
      --bg-header: rgba(5, 6, 9, 0.88);
      --bg-panel: rgba(11, 14, 22, 0.78);
      --bg-card-top: rgba(16, 20, 31, 0.72);
      --bg-card-bottom: rgba(10, 13, 20, 0.84);
      --text-title: #E8ECF2;      /* Anti-Halation Platinum White */
      --text-body: #A8B3C5;       /* Anti-Halation Soft Silver */
      --text-muted: #64748B;
      --neon-crimson: #D2042D;
      --neon-primary: #00f0ff;
      --neon-violet: #6530ff;
      --neon-emerald: #2cdb4c;
      --hl-bg: rgba(0, 240, 255, 0.16);
      --hl-text: #00f0ff;
    }

    /* Circadian Warm / Night Reading Mode Override */
    body.warm-mode {
      --bg-base: #0c0a08;
      --bg-header: rgba(12, 10, 8, 0.90);
      --bg-panel: rgba(22, 18, 15, 0.82);
      --bg-card-top: rgba(28, 23, 19, 0.76);
      --bg-card-bottom: rgba(18, 15, 12, 0.88);
      --text-title: #F0E8DC;
      --text-body: #B8ACA0;
      --text-muted: #7C7065;
      --neon-primary: #E5A93C;
      --neon-violet: #C87D55;
      --neon-emerald: #78B868;
      --hl-bg: rgba(229, 169, 60, 0.20);
      --hl-text: #F3C165;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 10% 0%, rgba(101, 48, 255, 0.06) 0px, transparent 45%),
        radial-gradient(at 90% 0%, rgba(0, 240, 255, 0.05) 0px, transparent 45%);
      color: var(--text-body);
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.warm-mode {
      background-image: 
        radial-gradient(at 15% 0%, rgba(229, 169, 60, 0.06) 0px, transparent 45%),
        radial-gradient(at 85% 0%, rgba(200, 125, 85, 0.05) 0px, transparent 45%);
    }

    .title-ergonomic {
      color: var(--text-title);
    }

    .body-ergonomic {
      color: var(--text-body);
      max-width: 68ch;
      line-height: 1.65;
    }

    /* Luxury Smoked Glassmorphism */
    .luxury-header {
      background: var(--bg-header);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .luxury-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 10px 30px -15px rgba(0, 0, 0, 0.7);
    }

    .luxury-card {
      position: relative;
      background: linear-gradient(180deg, var(--bg-card-top) 0%, var(--bg-card-bottom) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.09), 0 4px 20px -6px rgba(0, 0, 0, 0.55);
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .luxury-card:hover {
      border-color: color-mix(in srgb, var(--neon-primary) 38%, transparent);
      box-shadow: inset 0 1px 0 0 color-mix(in srgb, var(--neon-primary) 25%, transparent), 0 14px 34px -12px rgba(0, 0, 0, 0.7);
      transform: translateY(-1px);
    }

    /* Seen / Read Dimming */
    .luxury-card.seen-article {
      opacity: 0.64;
      border-color: rgba(255, 255, 255, 0.04);
    }
    .luxury-card.seen-article:hover {
      opacity: 1;
    }

    /* Progressive Hover Reveal ("Ghost" Actions to reduce visual crowding) */
    @media (hover: hover) {
      .ghost-actions {
        opacity: 0.42;
        transition: opacity 0.2s ease;
      }
      .luxury-card:hover .ghost-actions,
      .ghost-actions:focus-within {
        opacity: 1;
      }
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-body);
    }

    /* Semantic Neon States */
    .neon-primary-active {
      background: color-mix(in srgb, var(--neon-primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--neon-primary) 55%, transparent);
      color: var(--text-title);
      box-shadow: 0 0 15px -4px color-mix(in srgb, var(--neon-primary) 35%, transparent);
    }

    .neon-crimson-active {
      background: rgba(210, 4, 45, 0.15);
      border: 1px solid rgba(210, 4, 45, 0.65);
      color: #ffffff;
      box-shadow: 0 0 16px -4px rgba(210, 4, 45, 0.45);
    }

    .neon-violet-active {
      background: color-mix(in srgb, var(--neon-violet) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--neon-violet) 60%, transparent);
      color: var(--text-title);
      box-shadow: 0 0 15px -4px color-mix(in srgb, var(--neon-violet) 40%, transparent);
    }

    .badge-q1-elite {
      background: color-mix(in srgb, var(--neon-emerald) 11%, transparent);
      border: 1px solid color-mix(in srgb, var(--neon-emerald) 45%, transparent);
      color: var(--neon-emerald);
    }

    .badge-q1 {
      background: color-mix(in srgb, var(--neon-primary) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--neon-primary) 40%, transparent);
      color: var(--neon-primary);
    }

    mark.search-hl {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-bottom: 1px solid var(--hl-text);
      padding: 0 3px;
      border-radius: 2px;
      font-weight: 500;
    }

    .touch-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .touch-scroll::-webkit-scrollbar {
      display: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }

    /* Smart Scroll Header Collapse */
    #collapsibleTaxonomy {
      transition: max-height 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      max-height: 340px;
      opacity: 1;
    }
    #collapsibleTaxonomy.collapsed-nav {
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased pb-24 md:pb-12">

  <!-- ZERO-NOISE STICKY COMMAND HEADER -->
  <header class="sticky top-0 z-30 luxury-header px-3 sm:px-4 py-2.5 sm:py-3">
    <div class="max-w-5xl mx-auto space-y-2">
      
      <!-- Top Row: Brand, Search Bar & Core Modules -->
      <div class="flex items-center justify-between gap-2 sm:gap-3">
        
        <!-- Brand: VibePsych -->
        <button onclick="resetToHome()" class="flex items-center gap-2 group focus:outline-none shrink-0">
          <div class="w-9 h-9 rounded-xl bg-white/[0.03] border border-white/[0.1] group-hover:border-[var(--neon-primary)] flex items-center justify-center transition">
            <svg class="w-4 h-4 text-[var(--neon-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18"/>
              <path d="M5 7c0 5 3.5 7 7 7s7-2 7-7"/>
            </svg>
          </div>
          <span class="text-base sm:text-lg tracking-tight title-ergonomic">
            <span class="font-light opacity-75">Vibe</span><span class="font-semibold">Psych</span>
          </span>
        </button>

        <!-- Center: Default Global Scholar Search Bar (16px on mobile to prevent iOS auto-zoom) -->
        <div class="relative flex-1 max-w-2xl">
          <div class="flex items-center bg-white/[0.03] border border-white/[0.09] focus-within:border-[var(--neon-primary)] rounded-xl transition overflow-hidden">
            
            <button 
              id="scopeToggleBtn"
              onclick="toggleSearchScope()"
              title="Arama kapsamı: Küresel Scholar / Seçili Alan"
              class="px-2.5 sm:px-3 py-2 text-[11px] font-mono border-r border-white/[0.07] text-[var(--neon-primary)] bg-white/[0.03] hover:bg-white/[0.07] transition flex items-center gap-1 shrink-0">
              <i data-lucide="globe" class="w-3.5 h-3.5"></i>
              <span id="scopeToggleText" class="hidden md:inline">Küresel</span>
            </button>

            <div class="relative flex-1 flex items-center">
              <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 ml-2.5 shrink-0 hidden sm:block"></i>
              <input 
                id="searchInput" 
                type="text" 
                autocomplete="off"
                oninput="handleSearchInput()"
                placeholder="Kavram, makale veya yazar ara..." 
                class="w-full bg-transparent px-2.5 py-1.5 sm:py-2 text-[16px] sm:text-xs title-ergonomic placeholder-slate-500 focus:outline-none"
              />
              <button 
                id="clearSearchBtn"
                onclick="clearSearch()" 
                class="hidden pr-2 text-slate-500 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <button 
              onclick="executeSearch()" 
              class="px-3 sm:px-3.5 py-2 bg-white/[0.04] hover:bg-white/[0.09] title-ergonomic border-l border-white/[0.07] font-mono text-xs transition shrink-0">
              Ara
            </button>
          </div>

          <!-- Live Autocomplete Menu -->
          <div id="autocompleteMenu" class="hidden absolute left-0 right-0 top-full mt-1.5 luxury-panel rounded-xl z-50 overflow-hidden divide-y divide-white/[0.06]"></div>
        </div>

        <!-- Right: Favorite Journals, Directory, Vault & Circadian Warm Mode -->
        <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
          <!-- Favorite Journals Stream (#D2042D) -->
          <button 
            onclick="toggleFavJournalsStream()" 
            id="topFavStreamBtn"
            title="Sadece Favori Dergilerim"
            class="hidden sm:flex px-2.5 py-2 rounded-xl glass-pill hover:border-[#D2042D]/50 text-xs font-mono items-center gap-1.5 transition">
            <i data-lucide="heart" class="w-3.5 h-3.5 text-[#D2042D]"></i>
            <span class="hidden lg:inline">Favoriler</span>
            <span id="favJournalsCount" class="text-[11px] font-semibold text-[#D2042D]">0</span>
          </button>

          <!-- Live Journal Directory Modal -->
          <button 
            onclick="openDirectoryModal()" 
            title="Dergi İndeksi & Canlı Dergi Arama"
            class="hidden sm:flex px-2.5 py-2 rounded-xl glass-pill hover:border-[var(--neon-primary)] text-xs font-mono items-center gap-1.5 transition">
            <i data-lucide="library" class="w-3.5 h-3.5 text-[var(--neon-primary)]"></i>
            <span class="hidden xl:inline">Dergiler</span>
          </button>

          <!-- Vault / Collections -->
          <button 
            onclick="toggleVaultMode()" 
            id="topVaultBtn"
            title="Kişisel Literatür Kasası & Klasörler"
            class="hidden sm:flex px-2.5 py-2 rounded-xl glass-pill hover:border-[var(--neon-violet)] text-xs font-mono items-center gap-1.5 transition">
            <i data-lucide="folder-heart" class="w-3.5 h-3.5 text-[var(--neon-violet)]"></i>
            <span class="hidden xl:inline">Kasam</span>
            <span id="vaultCountBadge" class="text-[11px] font-semibold">0</span>
          </button>

          <!-- Circadian Warm / Night Reading Mode Toggle -->
          <button 
            onclick="toggleWarmMode()" 
            id="warmModeBtn"
            title="Sıcak Gece Okuma Modu (Göz Yorgunluğu Önleyici Kehribar Filtresi)"
            class="p-2 rounded-xl glass-pill hover:text-white transition">
            <i data-lucide="flame" id="warmModeIcon" class="w-4 h-4 text-slate-400"></i>
          </button>
        </div>

      </div>

      <!-- ALWAYS-VISIBLE SINGLE-LINE INLINE FILTER RIBBON -->
      <div class="flex items-center justify-between gap-2 overflow-x-auto touch-scroll pt-1 border-t border-white/[0.05] text-[11px] font-mono">
        
        <!-- One-Tap Year Presets -->
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="setYearFilter('all')" data-yr="all" class="yr-chip px-2.5 py-1 rounded-lg glass-pill hover:text-white transition">Tümü</button>
          <button onclick="setYearFilter('2026')" data-yr="2026" class="yr-chip px-2.5 py-1 rounded-lg glass-pill hover:text-white transition">2026</button>
          <button onclick="setYearFilter('2024+')" data-yr="2024+" class="yr-chip px-2.5 py-1 rounded-lg neon-primary-active transition">2024+</button>
          <button onclick="setYearFilter('5yr')" data-yr="5yr" class="yr-chip px-2.5 py-1 rounded-lg glass-pill hover:text-white transition">Son 5 Yıl</button>
        </div>

        <!-- Inline Sort, Methodology, Concept Matrix Trigger, OA & Compact -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Concept Intersection Matrix Toggle Button -->
          <button 
            id="matrixToggleBtn"
            onclick="toggleIntersectionBar()" 
            title="Çift Kavram Çarpıştırıcı (Kesişim Matrisi)"
            class="px-2.5 py-1 rounded-lg glass-pill hover:text-white flex items-center gap-1.5 transition">
            <i data-lucide="git-merge" class="w-3 h-3 text-[var(--neon-violet)]"></i>
            <span>+ Kesişim</span>
          </button>

          <div class="relative flex items-center">
            <select id="sortSelect" onchange="resetAndFetch()" class="glass-pill rounded-lg pl-2 pr-5 py-1 text-[11px] font-mono focus:outline-none appearance-none cursor-pointer bg-[#0a0d14]">
              <option value="publication_date:desc">En Güncel ↓</option>
              <option value="relevance_score:desc">Alaka Düzeyi ↓</option>
              <option value="cited_by_count:desc">En Çok Atıf ↓</option>
            </select>
            <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 absolute right-1.5 pointer-events-none"></i>
          </div>

          <div class="relative flex items-center">
            <select id="methodSelect" onchange="applyClientFilters()" class="glass-pill rounded-lg pl-2 pr-5 py-1 text-[11px] font-mono focus:outline-none appearance-none cursor-pointer bg-[#0a0d14]">
              <option value="ALL">Yöntem: Tümü</option>
              <option value="Meta-Analiz / Derleme">Meta-Analiz</option>
              <option value="Deneysel / RKÇ">Deneysel / RKÇ</option>
              <option value="Nörogörüntüleme">fMRI / EEG</option>
              <option value="Boylamasına">Boylamasına</option>
              <option value="Psikometri / Ölçek">Psikometri</option>
            </select>
            <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 absolute right-1.5 pointer-events-none"></i>
          </div>

          <button 
            id="oaFilterBtn" 
            onclick="toggleOAFilter()" 
            class="px-2.5 py-1 rounded-lg glass-pill hover:text-white flex items-center gap-1 transition">
            <span class="w-1.5 h-1.5 rounded-full bg-[var(--neon-emerald)]"></span>
            <span>PDF</span>
          </button>

          <button 
            id="compactModeBtn" 
            onclick="toggleCompactView()" 
            title="Kompakt Başlık Listesi / Standart Kart"
            class="px-2 py-1 rounded-lg glass-pill hover:text-white flex items-center transition">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
          </button>
        </div>

      </div>

      <!-- COLLAPSIBLE TAXONOMY, JOURNAL RAIL & CONCEPT INTERSECTION MATRIX -->
      <div id="collapsibleTaxonomy" class="space-y-1.5 pt-0.5">
        
        <!-- 16 Psychology & Neuroscience Sub-disciplines -->
        <div id="disciplineStrip" class="flex items-center gap-1.5 overflow-x-auto touch-scroll py-0.5"></div>

        <!-- Journal Switcher Strip -->
        <div class="flex items-center gap-1.5 bg-white/[0.02] border border-white/[0.06] rounded-xl px-2 py-1">
          <div class="flex items-center gap-0.5 shrink-0 border-r border-white/[0.07] pr-1.5">
            <button onclick="stepJournal(-1)" title="Önceki Dergi ( [ )" class="p-1 rounded-lg hover:bg-white/[0.06] text-slate-400 hover:text-white transition">
              <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="stepJournal(1)" title="Sonraki Dergi ( ] )" class="p-1 rounded-lg hover:bg-white/[0.06] text-slate-400 hover:text-white transition">
              <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <div id="journalStrip" class="flex items-center gap-1.5 overflow-x-auto touch-scroll flex-1"></div>

          <a id="activeJournalSiteBtn" href="#" target="_blank" rel="noopener noreferrer" class="hidden shrink-0 px-2 py-1 rounded-lg badge-q1-elite text-[10px] font-mono items-center gap-1 transition">
            <span>Site</span>
            <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
          </a>
        </div>

        <!-- DUAL CONCEPT INTERSECTION MATRIX BAR (Section 3.4) -->
        <div id="intersectionBar" class="hidden items-center gap-1.5 overflow-x-auto touch-scroll bg-[#6530ff]/[0.06] border border-[#6530ff]/30 rounded-xl px-2.5 py-1.5 text-[11px] font-mono">
          <span class="text-[#a78bfa] shrink-0 flex items-center gap-1 pr-1 border-r border-white/[0.08]">
            <i data-lucide="git-merge" class="w-3 h-3"></i>
            <span>Kesişim (AND):</span>
          </span>
          <div id="intersectionChips" class="flex items-center gap-1.5 shrink-0"></div>
        </div>

      </div>

    </div>
  </header>

  <!-- MAIN EDITORIAL WORKSPACE -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-3.5 space-y-3.5">

    <!-- Status Pills & Telemetry -->
    <div id="statusToolbar" class="flex flex-wrap items-center justify-between gap-2 text-xs font-mono px-0.5">
      <div id="activePillsContainer" class="flex flex-wrap items-center gap-1.5"></div>
      <div id="resultsTelemetryText" class="text-[11px] text-slate-500 ml-auto tabular-nums"></div>
    </div>

    <!-- CUSTOM RESEARCH COLLECTIONS / FOLDERS BAR (Section 3.3 - Visible in Kasam Mode) -->
    <div id="vaultCollectionsPanel" class="hidden luxury-panel rounded-2xl p-4 space-y-3.5 border-[#6530ff]/40">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <i data-lucide="folder-kanban" class="w-4 h-4 text-[var(--neon-violet)]"></i>
          <span class="text-xs font-semibold title-ergonomic">Araştırma Koleksiyonlarım & Klasörler</span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 font-mono text-[11px]">
          <button onclick="promptNewCollection()" class="px-2.5 py-1 rounded-lg glass-pill hover:border-[var(--neon-primary)] text-[var(--neon-primary)] flex items-center gap-1">
            <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
            <span>+ Yeni Klasör</span>
          </button>
          <button onclick="exportActiveCollectionAPA()" class="px-2.5 py-1 rounded-lg glass-pill hover:text-white flex items-center gap-1">
            <i data-lucide="copy" class="w-3 h-3"></i>
            <span>Klasörü APA 7 Kopyala</span>
          </button>
          <button onclick="downloadActiveCollectionMD()" class="px-2.5 py-1 rounded-lg neon-violet-active flex items-center gap-1">
            <i data-lucide="download" class="w-3 h-3"></i>
            <span>Toplu .MD İndir</span>
          </button>
        </div>
      </div>
      <!-- Folder Pills -->
      <div id="collectionFoldersBar" class="flex items-center gap-1.5 overflow-x-auto touch-scroll pt-1 border-t border-white/[0.06]"></div>
    </div>

    <!-- Smart Fallback Notice -->
    <div id="fallbackNotice" class="hidden luxury-panel rounded-xl px-4 py-2.5 border-[#D2042D]/40 text-xs font-mono flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#D2042D] shrink-0"></span>
        <span id="fallbackNoticeText"></span>
      </div>
      <button onclick="document.getElementById('fallbackNotice').classList.add('hidden')" class="text-slate-400 hover:text-white ml-2">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingBox" class="hidden luxury-panel rounded-2xl p-12 text-center space-y-3">
      <div class="inline-block w-6 h-6 border-2 border-[var(--neon-primary)] border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs font-mono text-slate-400">Akademik dizin sorgulanıyor...</p>
    </div>

    <!-- Articles Stream Container -->
    <div id="articlesContainer" class="space-y-3"></div>

    <!-- Pagination & Continuous Flow Footer -->
    <footer id="paginationBar" class="luxury-panel rounded-2xl p-3.5 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <button 
        onclick="appendNextPage()" 
        class="w-full sm:w-auto px-5 py-2.5 rounded-xl neon-primary-active text-xs font-mono font-medium flex items-center justify-center gap-2 transition">
        <i data-lucide="layers" class="w-3.5 h-3.5"></i>
        <span>Sonraki Sayfayı Akışa Ekle</span>
      </button>
      <div id="paginationControls" class="flex items-center gap-1.5 font-mono text-xs"></div>
    </footer>

  </main>

  <!-- RESPONSIVE INSPECTOR: BOTTOM SHEET ON MOBILE, RIGHT DRAWER ON DESKTOP -->

          hideAutocomplete();
        }
      });

        const y = window.scrollY;
        const navBox = document.getElementById('collapsibleTaxonomy');
        if (y > 190 && y > lastScrollY + 14) {
          navBox.classList.add('collapsed-nav');
        } else if (y < lastScrollY - 14 || y < 100) {
          navBox.classList.remove('collapsed-nav');
        }
        lastScrollY = y;
      }, { passive: true });

        const tag = document.activeElement?.tagName?.toLowerCase();

          closeInspector();
          closeDirectoryModal();
          hideAutocomplete();

      const term = prompt('Mevcut akışla kesiştirmek (AND) istediğiniz ikinci kavramı yazın (örn: mindfulness, fMRI, loneliness):');
      if (!term || !term.trim()) return;
      const clean = term.trim();
      activeIntersection = {
        id: 'custom',
        label: `+ ${clean}`,
        query: translateQuery(clean)
      };
      renderIntersectionChips();
      resetAndFetch();
    }

    // 7. FAVORITE JOURNALS & LIVE VENUE DISCOVERY (Section 1.2)
    function isJournalFavorited(issn, name) {
      return favJournals.some(j => (issn && j.issn === issn) || j.name.toLowerCase() === (name || '').toLowerCase());
    }

    function toggleFavoriteJournal(issn, name, event) {
      if (event) event.stopPropagation();
      const idx = favJournals.findIndex(j => (issn && j.issn === issn) || j.name.toLowerCase() === (name || '').toLowerCase());

      if (idx > -1) {
        const removed = favJournals[idx].name;
        favJournals.splice(idx, 1);
        showToast(`"${removed}" favorilerden çıkarıldı.`);
      } else {
        favJournals.push({ issn: issn || '', name });
        showToast(`♥ "${name}" Favori Dergilerinize eklendi.`);
      }

      localStorage.setItem('vibepsych_fav_journals', JSON.stringify(favJournals));
      updateCounters();
      renderDisciplineStrip();
      renderJournalStrip();
      if (!document.getElementById('directoryModal').classList.contains('hidden')) {
        renderDirectoryGrid();
      }
      if (isFavJournalsStream) {
        if (favJournals.length === 0) isFavJournalsStream = false;
        resetAndFetch();
      } else {
        applyClientFilters();
      }
    }

    function toggleFavJournalsStream() {
      if (favJournals.length === 0) {
        showToast('Önce dergilerin yanındaki kalp (♥) ikonuna dokunarak favori dergi listenizi oluşturun.');
        openDirectoryModal();
        return;
      }
      isVaultMode = false;
      activeAuthorFilter = null;
      activeSnowball = null;
      activeJournal = null;
      isFavJournalsStream = !isFavJournalsStream;
      updateCounters();
      renderDisciplineStrip();
      renderJournalStrip();
      resetAndFetch();
    }

    function updateCounters() {
      document.getElementById('favJournalsCount').textContent = favJournals.length;
      document.getElementById('vaultCountBadge').textContent = vaultList.length;
      document.getElementById('mobFavCount').textContent = favJournals.length;
      document.getElementById('mobVaultCount').textContent = vaultList.length;

      const topFav = document.getElementById('topFavStreamBtn');
      topFav.className = isFavJournalsStream
        ? 'hidden sm:flex px-2.5 py-2 rounded-xl neon-crimson-active text-xs font-mono items-center gap-1.5 transition'
        : 'hidden sm:flex px-2.5 py-2 rounded-xl glass-pill hover:border-[#D2042D]/50 text-xs font-mono items-center gap-1.5 transition';
    }

    // 8. DISCIPLINE & JOURNAL RAILS

        <button 
          onclick="toggleFavJournalsStream()"
          class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border flex items-center gap-1.5 shrink-0 ${
            isFavJournalsStream 
              ? 'neon-crimson-active' 
              : 'bg-[#D2042D]/[0.07] title-ergonomic border-[#D2042D]/30 hover:border-[#D2042D]/60'
          }">

          <span>Favori Dergilerim (${favJournals.length})</span>
        </button>
      `;

    function selectDiscipline(id) {
      isVaultMode = false;
      isFavJournalsStream = false;
      activeAuthorFilter = null;
      activeSnowball = null;
      activeDomain = PSYCH_DOMAINS.find(d => d.id === id) || PSYCH_DOMAINS[0];

      renderDisciplineStrip();

    function renderJournalStrip() {
      const strip = document.getElementById('journalStrip');
      const siteBtn = document.getElementById('activeJournalSiteBtn');
      const list = isFavJournalsStream ? favJournals : activeDomain.journals;

      if (activeJournal?.issn) {
        updateOfficialSiteLink(activeJournal.issn);
      } else {
        siteBtn.classList.add('hidden');
      }

      const poolActive = activeJournal === null;
      let html = `
        <button 
          onclick="selectJournal(null)"
          class="px-2.5 py-1 rounded-lg text-[11px] font-mono whitespace-nowrap border transition shrink-0 ${
            poolActive 
              ? (isFavJournalsStream ? 'neon-crimson-active' : 'neon-primary-active') 
              : 'glass-pill hover:text-white'
          }">
          ${isFavJournalsStream ? `Tüm Favoriler (${favJournals.length})` : `Tüm Q1 Havuzu (${list.length})`}
        </button>
      `;

      list.forEach((j, idx) => {

        html += `
          <div class="inline-flex items-center rounded-lg border transition shrink-0 overflow-hidden ${
            isSelected ? 'neon-primary-active' : 'glass-pill hover:border-white/20'

              onclick="selectJournal(${idx})"
              class="pl-2.5 pr-1.5 py-1 text-[11px] font-mono whitespace-nowrap text-left hover:text-white transition">
              ${escapeHtml(j.name)}

            <button 
              onclick="toggleFavoriteJournal('${j.issn || ''}', '${j.name.replace(/'/g, "\\'")}', event)"
              class="px-1.5 py-1 hover:bg-white/[0.08] transition flex items-center">
              <i data-lucide="heart" class="w-3 h-3 ${isFav ? 'text-[#D2042D] fill-[#D2042D]' : 'text-slate-500 hover:text-[#D2042D]'}"></i>

    function selectJournal(idx) {
      isVaultMode = false;
      activeAuthorFilter = null;
      activeSnowball = null;
      const list = isFavJournalsStream ? favJournals : activeDomain.journals;
      activeJournal = (idx === null || idx < 0) ? null : list[idx];
      renderJournalStrip();
      resetAndFetch();
    }

    function stepJournal(dir) {
      const list = isFavJournalsStream ? favJournals : activeDomain.journals;
      if (!list || list.length === 0) return;
      let idx = activeJournal ? list.findIndex(j => j.name === activeJournal.name) : -1;
      let next = idx + dir;
      if (next >= list.length) next = -1;
      if (next < -1) next = list.length - 1;
      selectJournal(next === -1 ? null : next);
    }

    async function updateOfficialSiteLink(issn) {
      const btn = document.getElementById('activeJournalSiteBtn');
      if (!issn) {
        btn.classList.add('hidden');
        return;
      }
      if (sourceCache[issn]?.homepage_url) {
        btn.href = sourceCache[issn].homepage_url;
        btn.classList.remove('hidden');
        btn.classList.add('inline-flex');
        return;
      }
      try {
        const res = await fetch(`https://api.openalex.org/sources?filter=issn:${encodeURIComponent(issn)}&per-page=1`);
        const data = await res.json();
        const src = data.results?.[0];
        if (src) {
          sourceCache[issn] = {
            h_index: src.summary_stats?.h_index || 0,
            impact_2yr: src.summary_stats?.['2yr_mean_citedness'] || 0,
            homepage_url: src.homepage_url || null
          };
          if (src.homepage_url) {
            btn.href = src.homepage_url;
            btn.classList.remove('hidden');
            btn.classList.add('inline-flex');
          }
        }
      } catch (e) {}
    }

    // 10. SEARCH & AUTOCOMPLETE
    function toggleSearchScope() {
      searchScope = searchScope === 'scholar_global' ? 'contextual' : 'scholar_global';
      const txt = document.getElementById('scopeToggleText');
      txt.textContent = searchScope === 'scholar_global' ? 'Küresel' : 'Seçili Alan';
      showToast(searchScope === 'scholar_global' ? 'Küresel Scholar Modu aktif.' : 'Seçili Alan/Dergi Modu aktif.');
      if (document.getElementById('searchInput').value.trim().length > 0) executeSearch();
    }

    function translateQuery(raw) {
      let q = raw.trim();
      const low = q.toLowerCase();
      if (TR_EN_MAP[low]) return TR_EN_MAP[low];
      for (const [tr, en] of Object.entries(TR_EN_MAP)) {
        if (low.includes(tr)) {
          q = low.replace(tr, en);
          break;
        }
      }
      return q;
    }

    function handleSearchInput() {
      const val = document.getElementById('searchInput').value.trim();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);
      applyClientFilters();

      clearTimeout(typingTimer);
      if (val.length < 3) {
        hideAutocomplete();
        return;
      }
      typingTimer = setTimeout(() => fetchAutocomplete(val), 220);
    }

    async function fetchAutocomplete(query) {
      const trans = translateQuery(query);
      try {
        const res = await fetch(`https://api.openalex.org/autocomplete/works?q=${encodeURIComponent(trans)}`);
        const data = await res.json();
        const list = (data.results || []).slice(0, 5);
        const menu = document.getElementById('autocompleteMenu');
        if (list.length === 0) {
          hideAutocomplete();
          return;
        }
        menu.innerHTML = `
          <div class="px-3.5 py-1.5 bg-black/60 text-[10px] font-mono text-[var(--neon-primary)] flex items-center justify-between">
            <span>Hızlı Eşleşmeler (Tam arama için Enter)</span>
            ${trans !== query.trim() ? `<span class="text-[var(--neon-emerald)]">TR➔EN: ${escapeHtml(trans)}</span>` : ''}
          </div>
        ` + list.map(it => `
          <button 
            onclick="pickAutocomplete('${escapeHtml(it.display_name).replace(/'/g, "\\'")}')"
            class="w-full text-left px-3.5 py-2 hover:bg-white/[0.06] transition flex items-center justify-between gap-3">
            <span class="text-xs title-ergonomic line-clamp-1 font-serif">${escapeHtml(it.display_name)}</span>
            <span class="text-[10px] font-mono text-slate-500 shrink-0">${escapeHtml(it.hint || '')}</span>
          </button>
        `).join('');
        menu.classList.remove('hidden');
      } catch (e) {
        hideAutocomplete();
      }
    }

    function pickAutocomplete(title) {
      document.getElementById('searchInput').value = title;
      hideAutocomplete();
      executeSearch();
    }

    function hideAutocomplete() {
      document.getElementById('autocompleteMenu').classList.add('hidden');
    }

    function executeSearch() {
      activeAuthorFilter = null;
      activeSnowball = null;
      const q = document.getElementById('searchInput').value.trim();
      document.getElementById('sortSelect').value = q.length > 0 ? 'relevance_score:desc' : 'publication_date:desc';
      resetAndFetch();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('sortSelect').value = 'publication_date:desc';
      hideAutocomplete();
      resetAndFetch();
    }

    // 11. OPENALEX FETCH ENGINE (WITH DUAL CONCEPT INTERSECTION)
    function resetAndFetch() {
      currentPage = 1;
      document.getElementById('fallbackNotice').classList.add('hidden');
      fetchLiterature(false, false);
    }

    function goToPage(p) {
      if (p < 1) return;
      currentPage = p;
      fetchLiterature(false, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function appendNextPage() {
      currentPage += 1;
      fetchLiterature(true, false);
    }

    async function fetchLiterature(appendMode = false, isFallback = false) {
      document.getElementById('vaultCollectionsPanel').classList.toggle('hidden', !isVaultMode);
      if (isVaultMode) {
        renderVaultCollectionsBar();
        renderVaultStream();
        return;
      }

      const loader = document.getElementById('loadingBox');
      const container = document.getElementById('articlesContainer');
      loader.classList.remove('hidden');
      if (!appendMode) container.innerHTML = '';

      const rawQ = document.getElementById('searchInput').value.trim();
      const effectiveQ = translateQuery(rawQ);
      const hasSearch = effectiveQ.length > 0;
      const sortVal = document.getElementById('sortSelect').value;

      let filters = ['type:article|review'];

      // Strict Global Year Filter
      if (!isFallback) {
        if (activeYearFilter === '2026') filters.push('from_publication_date:2026-01-01');
        else if (activeYearFilter === '2024+') filters.push('from_publication_date:2024-01-01');
        else if (activeYearFilter === '5yr') filters.push('from_publication_date:2021-01-01');
      }

      if (onlyOA) filters.push('is_oa:true');

      // Venue / Author / Snowball / Intersection Logic
      if (activeAuthorFilter) {
        filters.push(`author.id:${activeAuthorFilter.id}`);
      } else if (activeSnowball) {
        const shortId = activeSnowball.workId.replace('https://openalex.org/', '');
        filters.push(activeSnowball.mode === 'cites' ? `cites:${shortId}` : `related_to:${shortId}`);
      } else if (isFallback) {
        // Global fallback
      } else if (isFavJournalsStream) {
        const favIssns = favJournals.map(j => j.issn).filter(Boolean);
        if (activeJournal?.issn) filters.push(`primary_location.source.issn:${activeJournal.issn}`);
        else if (favIssns.length > 0) filters.push(`primary_location.source.issn:${favIssns.join('|')}`);
      } else if (hasSearch && searchScope === 'scholar_global' && !activeIntersection) {
        // Global Scholar search
      } else {
        if (activeJournal?.issn) {
          filters.push(`primary_location.source.issn:${activeJournal.issn}`);
        } else {
          const issnPool = activeDomain.journals.map(j => j.issn).join('|');
          filters.push(`primary_location.source.issn:${issnPool}`);
        }
      }

      // Combine Search Query + Active Intersection Matrix Concept (Section 3.4)
      let combinedSearch = '';
      if (hasSearch && activeIntersection) {
        combinedSearch = `(${effectiveQ}) AND (${activeIntersection.query})`;
      } else if (hasSearch) {
        combinedSearch = effectiveQ;
      } else if (activeIntersection) {
        combinedSearch = activeIntersection.query;
      }

      let apiUrl = `https://api.openalex.org/works?filter=${encodeURIComponent(filters.join(','))}&sort=${encodeURIComponent(sortVal)}&per-page=25&page=${currentPage}`;
      if (combinedSearch && !activeAuthorFilter && !activeSnowball) {
        apiUrl += `&search=${encodeURIComponent(combinedSearch)}`;
      }

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        const works = data.results || [];
        totalWorksCount = data.meta?.count || works.length;

        if (works.length === 0 && !isFallback && (combinedSearch || activeJournal || isFavJournalsStream)) {
          const fb = document.getElementById('fallbackNotice');
          document.getElementById('fallbackNoticeText').textContent = 
            `Seçili dar havuzda kesişim bulunamadı; kapsam genişletilerek küresel literatür sonuçları getirildi.`;
          fb.classList.remove('hidden');
          await fetchLiterature(false, true);
          return;
        }

        const missingIds = [...new Set(
          works
            .map(w => w.primary_location?.source?.id)
            .filter(id => id && !sourceCache[id])
            .map(id => id.replace('https://openalex.org/', ''))
        )];

        if (missingIds.length > 0) {
          const sRes = await fetch(`https://api.openalex.org/sources?filter=openalex_id:${missingIds.slice(0, 35).join('|')}&per-page=35`);
          const sData = await sRes.json();
          (sData.results || []).forEach(src => {
            const info = {
              h_index: src.summary_stats?.h_index || 0,
              impact_2yr: src.summary_stats?.['2yr_mean_citedness'] || 0,
              homepage_url: src.homepage_url || null
            };
            sourceCache[src.id] = info;
            if (src.issn_l) sourceCache[src.issn_l] = info;
          });
        }

        const processed = works
          .filter(w => !/^(correction to|erratum|corrigendum)/i.test(w.title || ''))
          .map(w => enrichWork(w));

        processed.forEach(a => articleMap.set(a.id, a));

        if (appendMode) {
          const existing = new Set(currentArticles.map(x => x.id));
          processed.forEach(a => { if (!existing.has(a.id)) currentArticles.push(a); });
        } else {
          currentArticles = processed;
        }

        loader.classList.add('hidden');
        renderStatusPills(rawQ, effectiveQ);
        applyClientFilters();
        renderPagination();

      } catch (err) {
        loader.classList.add('hidden');
        container.innerHTML = `<div class="luxury-panel rounded-2xl p-8 text-center text-xs font-mono text-[#D2042D]">Bağlantı hatası: ${escapeHtml(err.message)}</div>`;
      }
    }

    function enrichWork(w) {
      const absText = cleanXml(rebuildAbstract(w.abstract_inverted_index));
      const src = w.primary_location?.source || {};
      const srcId = src.id;
      const issn = src.issn_l || (src.issn ? src.issn[0] : '');
      const journalName = src.display_name || activeJournal?.name || 'Akademik Dergi';

      const metrics = (srcId && sourceCache[srcId]) || (issn && sourceCache[issn]) || { h_index: null, impact_2yr: 0, homepage_url: null };
      const isPrestige = (issn && PRESTIGE_ISSNS.has(issn)) || PRESTIGE_NAMES.has(journalName.toLowerCase());

      let quartile = 'Q2';
      let qClass = 'glass-pill';

      if (isPrestige || metrics.impact_2yr >= 3.5 || (metrics.h_index && metrics.h_index >= 110)) {
        quartile = 'Q1 ELITE';
        qClass = 'badge-q1-elite';
      } else if (metrics.impact_2yr >= 2.0 || (metrics.h_index && metrics.h_index >= 65)) {
        quartile = 'Q1';
        qClass = 'badge-q1';
      }

      const textCorpus = `${w.title || ''} ${absText}`.toLowerCase();
      const methods = [];
      if (/meta-analys|meta analys|systematic review|prisma/.test(textCorpus)) methods.push('Meta-Analiz / Derleme');
      if (/randomized controlled|rct|experiment|placebo|double-blind/.test(textCorpus)) methods.push('Deneysel / RKÇ');
      if (/fmri|eeg|erp|neuroimaging|bold signal|prefrontal|amygdala/.test(textCorpus)) methods.push('Nörogörüntüleme');
      if (/longitudinal|prospective cohort|follow-up/.test(textCorpus)) methods.push('Boylamasına');
      if (/psychometric|confirmatory factor|cronbach|item response|scale/.test(textCorpus)) methods.push('Psikometri / Ölçek');
      if (methods.length === 0) methods.push('Araştırma');

      const authorObjs = (w.authorships || []).slice(0, 4).map(a => ({
        id: a.author?.id ? a.author.id.replace('https://openalex.org/', '') : '',
        name: a.author?.display_name || ''
      })).filter(a => a.name);

      return {
        id: w.id,
        title: cleanXml(w.title || 'Başlıksız Çalışma'),
        pubDate: w.publication_date || `${w.publication_year || ''}`,
        pubYear: w.publication_year || '',
        journalName,
        issn,
        hIndex: metrics.h_index,
        impact2yr: metrics.impact_2yr ? metrics.impact_2yr.toFixed(2) : null,
        quartile,
        qClass,
        citations: w.cited_by_count || 0,
        isOA: w.open_access?.is_oa || false,
        oaUrl: w.open_access?.oa_url || w.doi || '#',
        doi: w.doi || '',
        authorObjs,
        authors: authorObjs.map(a => a.name),
        totalAuthors: (w.authorships || []).length,
        abstractText: absText,
        methods,
        folder: 'Genel Okumalar'
      };
    }

    function rebuildAbstract(inv) {
      if (!inv) return 'Tam metin ve özet detayları için doğrudan DOI bağlantısını ziyaret edebilirsiniz.';
      const arr = [];
      for (const [w, pos] of Object.entries(inv)) {
        for (const p of pos) arr[p] = w;
      }
      return arr.join(' ');
    }

    function cleanXml(s) {
      return String(s).replace(/<[^>]+>/g, ' ').replace(/^Abstract[:\s]*/i, '').replace(/\s+/g, ' ').trim();
    }

    // 12. HIGHLIGHTING & CARD RENDERING
    function getHighlightTokens() {
      const raw = document.getElementById('searchInput').value.trim();
      const inter = activeIntersection ? activeIntersection.query.replace(/OR|AND|"/g, ' ') : '';
      if (!raw && !inter) return [];
      const trans = raw ? translateQuery(raw) : '';
      return [...new Set(
        `${raw} ${trans} ${inter}`
          .split(/\s+/)
          .map(s => s.replace(/["'()]/g, '').trim())
          .filter(s => s.length >= 3 && !['and', 'or', 'the', 'for'].includes(s.toLowerCase()))
      )];
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlightText(text) {
      const safe = escapeHtml(text || '');
      const tokens = getHighlightTokens();
      if (tokens.length === 0) return { html: safe, hits: 0 };
      const pattern = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      const rx = new RegExp(`(${pattern})`, 'gi');
      let hits = 0;
      const html = safe.replace(rx, m => {
        hits++;
        return `<mark class="search-hl">${m}</mark>`;
      });
      return { html, hits };
    }

    function renderStatusPills(rawQ, transQ) {
      const box = document.getElementById('activePillsContainer');
      const pills = [];

      if (isFavJournalsStream) {
        pills.push(`<span class="px-2.5 py-1 rounded-lg neon-crimson-active text-[11px] flex items-center gap-1.5"><span>♥ Favori Dergilerim</span><button onclick="toggleFavJournalsStream()">✕</button></span>`);
      }
      if (activeIntersection) {
        pills.push(`<span class="px-2.5 py-1 rounded-lg neon-violet-active text-[11px] flex items-center gap-1.5"><span>Kesişim: ${escapeHtml(activeIntersection.label)}</span><button onclick="selectIntersection('${activeIntersection.id}')">✕</button></span>`);
      }
      if (activeAuthorFilter) {
        pills.push(`<span class="px-2.5 py-1 rounded-lg neon-violet-active text-[11px] flex items-center gap-1.5"><span>Yazar: ${escapeHtml(activeAuthorFilter.name)}</span><button onclick="clearAuthorFilter()">✕</button></span>`);

        pills.push(`<span class="px-2.5 py-1 rounded-lg neon-violet-active text-[11px] flex items-center gap-1.5"><span>${activeSnowball.mode === 'cites' ? 'Atıf Yapanlar' : 'Benzerler'}</span><button onclick="clearSnowball()">✕</button></span>`);
      }
      if (rawQ) {
        const lbl = transQ !== rawQ ? `"${rawQ}" ➔ ${transQ}` : `"${rawQ}"`;
        pills.push(`<span class="px-2.5 py-1 rounded-lg neon-primary-active text-[11px] flex items-center gap-1.5"><span>Arama: ${escapeHtml(lbl)}</span><button onclick="clearSearch()">✕</button></span>`);
      }

      box.innerHTML = pills.join('');
    }

    function applyClientFilters() {
      const methodVal = document.getElementById('methodSelect').value;
      const base = isVaultMode ? vaultList : currentArticles;

      const filtered = base.filter(a => {
        if (isVaultMode && activeVaultCollection !== 'ALL' && (a.folder || 'Genel Okumalar') !== activeVaultCollection) return false;
        if (methodVal !== 'ALL' && !a.methods.includes(methodVal)) return false;
        return true;
      });

      document.getElementById('resultsTelemetryText').textContent = isVaultMode
        ? `Klasörde ${filtered.length} makale`
        : `Sayfa ${currentPage} • ${filtered.length} gösterilen (Toplam: ${totalWorksCount.toLocaleString('tr-TR')})`;

      renderCards(filtered);
      lucide.createIcons();
    }

    // 13. DIRECT OBSIDIAN URI PROTOCOL INTEGRATION (Section 3.2)
    function buildMarkdownContent(art) {
      const folderTag = (art.folder || 'Genel Okumalar').toLowerCase().replace(/\s+/g, '-');
      return `---
title: "${art.title.replace(/"/g, '\\"')}"
authors: [${art.authors.map(a => `"${a}"`).join(', ')}]
journal: "${art.journalName}"
issn: "${art.issn}"
year: ${art.pubYear}
date: "${art.pubDate}"
quartile: "${art.quartile}"
journal_h_index: ${art.hIndex || 0}
citations: ${art.citations}
collection: "${art.folder || 'Genel Okumalar'}"
doi: "${art.doi}"
tags:
  - literature-note
  - vibepsych/${activeDomain.id}
  - collection/${folderTag}
---

# ${art.title}

- **Dergi:** ${art.journalName} (${art.quartile} | H-Index: ${art.hIndex || 'N/A'})
- **Yayın Tarihi:** ${art.pubDate} | **Atıf:** ${art.citations}
- **DOI:** ${art.doi}

## Özet (Abstract)
${art.abstractText}

## Araştırma Sentezi & Notlarım
- 
`;
    }

    function openInObsidianApp(id) {
      const art = articleMap.get(id) || vaultList.find(v => v.id === id);
      if (!art) return;
      const md = buildMarkdownContent(art);
      const safeTitle = art.title.replace(/[\\/:*?"<>|]/g, '').slice(0, 65).trim();
      const uri = `obsidian://new?name=${encodeURIComponent(safeTitle)}&content=${encodeURIComponent(md)}`;
      window.location.href = uri;
      showToast('Obsidian uygulaması tetiklendi...');
    }

    function renderVaultCollectionsBar() {
      const bar = document.getElementById('collectionFoldersBar');
      let html = `
        <button 
          onclick="selectVaultCollection('ALL')"
          class="px-3 py-1 rounded-lg text-xs font-mono whitespace-nowrap transition ${
            activeVaultCollection === 'ALL' ? 'neon-violet-active' : 'glass-pill hover:text-white'
          }">
          Tüm Klasörler (${vaultList.length})
        </button>
      `;

      customCollections.forEach(col => {
        const count = vaultList.filter(v => (v.folder || 'Genel Okumalar') === col).length;

        html += `
          <button 
            onclick="selectVaultCollection('${col.replace(/'/g, "\\'")}')"
            class="px-3 py-1 rounded-lg text-xs font-mono whitespace-nowrap transition flex items-center gap-1.5 ${
              active ? 'neon-violet-active' : 'glass-pill hover:text-white'

            <span class="text-[10px] opacity-75">(${count})</span>
          </button>

      bar.innerHTML = html;

    function selectVaultCollection(colName) {
      activeVaultCollection = colName;
      renderVaultCollectionsBar();
      applyClientFilters();
    }

    function promptNewCollection() {
      const name = prompt('Yeni araştırma klasörünün adını girin (örn: Deneysel Tasarım, Tez Literatürü):');
      if (!name || !name.trim()) return;
      const clean = name.trim();
      if (!customCollections.includes(clean)) {
        customCollections.push(clean);
        localStorage.setItem('vibepsych_collections', JSON.stringify(customCollections));
      }
      activeVaultCollection = clean;
      renderVaultCollectionsBar();
      applyClientFilters();
      showToast(`"📁 ${clean}" klasörü oluşturuldu.`);
    }

    function changeArticleFolder(artId, newFolder) {
      const item = vaultList.find(v => v.id === artId);
      if (item) {
        item.folder = newFolder;
        localStorage.setItem('vibepsych_vault', JSON.stringify(vaultList));
        renderVaultCollectionsBar();
        showToast(`Makale "📁 ${newFolder}" klasörüne taşındı.`);
      }
    }

    function toggleVaultArticle(id) {
      const idx = vaultList.findIndex(v => v.id === id);
      if (idx > -1) {
        vaultList.splice(idx, 1);
        showToast('Makale kasadan çıkarıldı.');
      } else {
        const art = articleMap.get(id);
        if (art) {
          const targetFolder = (isVaultMode && activeVaultCollection !== 'ALL') ? activeVaultCollection : customCollections[0];
          art.folder = targetFolder;
          vaultList.unshift(art);
          showToast(`Makale "📁 ${targetFolder}" klasörüne kaydedildi.`);
        }
      }
      localStorage.setItem('vibepsych_vault', JSON.stringify(vaultList));
      updateCounters();
      if (isVaultMode) renderVaultCollectionsBar();
      applyClientFilters();
    }

    function toggleVaultMode() {
      isVaultMode = !isVaultMode;
      isFavJournalsStream = false;
      updateCounters();
      renderDisciplineStrip();
      document.getElementById('vaultCollectionsPanel').classList.toggle('hidden', !isVaultMode);
      if (isVaultMode) {
        renderVaultCollectionsBar();
        renderVaultStream();
      } else {
        resetAndFetch();
      }
    }

    function renderVaultStream() {
      vaultList.forEach(a => articleMap.set(a.id, a));
      applyClientFilters();
    }

    function getActiveVaultSubset() {
      return activeVaultCollection === 'ALL'
        ? vaultList
        : vaultList.filter(v => (v.folder || 'Genel Okumalar') === activeVaultCollection);
    }

    function exportActiveCollectionAPA() {
      const list = getActiveVaultSubset();
      if (list.length === 0) return;
      const apa = list.map(art => {
        const au = art.authors.length > 0 ? art.authors.join(', ') : 'Yazar Belirtilmemiş';
        return `${au} (${art.pubYear}). ${art.title}. ${art.journalName}. ${art.doi}`;
      }).join('\n\n');
      navigator.clipboard.writeText(apa);
      showToast(`${list.length} makale APA 7 kaynakça listesi olarak kopyalandı.`);
    }

    function downloadActiveCollectionMD() {
      const list = getActiveVaultSubset();
      if (list.length === 0) return;
      const colTitle = activeVaultCollection === 'ALL' ? 'Tüm_Kasa' : activeVaultCollection.replace(/\s+/g, '_');
      const content = `# VibePsych Araştırma Klasörü: ${activeVaultCollection}\n\n` +
        list.map(art => `## ${art.title}\n- **Klasör:** ${art.folder || 'Genel Okumalar'}\n- **Yazarlar:** ${art.authors.join(', ')}\n- **Dergi:** ${art.journalName} (${art.quartile} | H-Index: ${art.hIndex || 'N/A'})\n- **Tarih:** ${art.pubDate} | **Atıf:** ${art.citations}\n- **DOI:** ${art.doi}\n\n### Özet\n${art.abstractText}\n\n---\n`).join('\n');

      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VibePsych_${colTitle}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function splitAbstract(t) {
      const s = t.split(/(?<=[.!?])\s+/);
      if (s.length <= 3) return { bg: t, method: null, res: null };
      const k = Math.ceil(s.length / 3);
      return { bg: s.slice(0, k).join(' '), method: s.slice(k, k * 2).join(' '), res: s.slice(k * 2).join(' ') };
    }

    // 16. LIVE OPENALEX VENUE DISCOVERY ENGINE IN DIRECTORY MODAL (Section 1.2)
    function openDirectoryModal() {
      document.getElementById('directoryModal').classList.remove('hidden');
      renderDirectoryGrid();
    }

    function closeDirectoryModal() {
      document.getElementById('directoryModal').classList.add('hidden');
    }

    function handleDirectorySearch() {
      renderDirectoryGrid();
      const q = (document.getElementById('dirSearchInput').value || '').trim();
      const liveBox = document.getElementById('liveVenueResultsBox');

      clearTimeout(dirSearchTimer);
      if (q.length < 3) {
        liveBox.classList.add('hidden');
        return;
      }
      dirSearchTimer = setTimeout(() => searchLiveOpenAlexVenues(q), 280);
    }

    async function searchLiveOpenAlexVenues(query) {
      const liveBox = document.getElementById('liveVenueResultsBox');
      liveBox.classList.remove('hidden');
      liveBox.innerHTML = `<div class="text-xs font-mono text-slate-400 p-3">OpenAlex 100.000+ dergi dizininde "${escapeHtml(query)}" aranıyor...</div>`;

      try {
        const res = await fetch(`https://api.openalex.org/sources?search=${encodeURIComponent(query)}&filter=type:journal&per-page=8`);
        const data = await res.json();
        const venues = (data.results || []).filter(v => v.issn_l);

        if (venues.length === 0) {
          liveBox.innerHTML = `<div class="text-xs font-mono text-slate-500 p-2">Canlı dizinde eşleşen ISSN kayıtlı dergi bulunamadı.</div>`;
          return;
        }

        liveBox.innerHTML = `
          <div class="bg-white/[0.02] border border-[var(--neon-primary)]/40 rounded-xl p-4 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-[var(--neon-primary)] font-semibold">🌐 OpenAlex Canlı Dergi Keşfi (100.000+ Dizin Sonuçları)</span>
              <span class="text-[10px] font-mono text-slate-400">Kalp ikonuna basarak Favorilerinize sabitleyebilirsiniz</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              ${venues.map(v => {
                const issn = v.issn_l;
                const name = v.display_name;
                const h = v.summary_stats?.h_index || 0;
                const if2 = v.summary_stats?.['2yr_mean_citedness'] ? v.summary_stats['2yr_mean_citedness'].toFixed(2) : '-';
                const fav = isJournalFavorited(issn, name);
                return `
                  <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-black/40 border border-white/[0.07] text-xs font-mono">
                    <button onclick="closeDirectoryModal(); filterByCardJournal('${name.replace(/'/g, "\\'")}', '${issn}')" class="text-left min-w-0 flex-1">
                      <div class="title-ergonomic hover:text-[var(--neon-primary)] truncate">${escapeHtml(name)}</div>
                      <div class="text-[10px] text-slate-400">ISSN: ${issn} • H-Index: ${h} • 2yr IF: ${if2}</div>
                    </button>
                    <button onclick="toggleFavoriteJournal('${issn}', '${name.replace(/'/g, "\\'")}', event); searchLiveOpenAlexVenues('${query.replace(/'/g, "\\'")}')" class="p-1.5 rounded hover:bg-white/[0.08] shrink-0">
                      <i data-lucide="heart" class="w-4 h-4 ${fav ? 'text-[#D2042D] fill-[#D2042D]' : 'text-slate-400 hover:text-[#D2042D]'}"></i>
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        lucide.createIcons();
      } catch (e) {
        liveBox.classList.add('hidden');
      }
    }

    function renderDirectoryGrid() {
      const q = (document.getElementById('dirSearchInput').value || '').toLowerCase().trim();
      const grid = document.getElementById('directoryGrid');
      let html = '';

      if (favJournals.length > 0 && !q) {
        html += `
          <div class="md:col-span-2 bg-[#D2042D]/[0.06] border border-[#D2042D]/30 rounded-xl p-4 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono font-semibold text-[#D2042D]">♥ Favori Dergilerim (${favJournals.length})</span>
              <button onclick="closeDirectoryModal(); if(!isFavJournalsStream) toggleFavJournalsStream();" class="text-[11px] font-mono title-ergonomic underline">
                Tüm Favori Akışını Aç →
              </button>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${favJournals.map(j => `
                <div class="inline-flex items-center rounded-lg neon-crimson-active text-[11px] font-mono overflow-hidden">
                  <button onclick="closeDirectoryModal(); filterByCardJournal('${j.name.replace(/'/g, "\\'")}', '${j.issn}')" class="pl-2.5 pr-1.5 py-1">
                    ${escapeHtml(j.name)}
                  </button>
                  <button onclick="toggleFavoriteJournal('${j.issn}', '${j.name.replace(/'/g, "\\'")}', event)" class="px-1.5 py-1 hover:bg-black/30">✕</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      html += PSYCH_DOMAINS.map(d => {
        const matched = d.journals.filter(j => !q || j.name.toLowerCase().includes(q) || j.issn.toLowerCase().includes(q));
        if (matched.length === 0) return '';
        return `
          <div class="bg-white/[0.02] border border-white/[0.07] rounded-xl p-4 space-y-2.5">
            <h4 class="font-serif text-base title-ergonomic border-b border-white/[0.06] pb-1.5">${d.name}</h4>
            <div class="space-y-1">
              ${matched.map(j => {
                const fav = isJournalFavorited(j.issn, j.name);
                return `
                  <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-white/[0.02] hover:bg-white/[0.05] border border-white/[0.05] transition text-xs font-mono">
                    <button onclick="pickJournalFromModal('${d.id}', '${j.issn}')" class="title-ergonomic hover:text-[var(--neon-primary)] truncate text-left flex-1">
                      ${escapeHtml(j.name)}
                    </button>
                    <button onclick="toggleFavoriteJournal('${j.issn}', '${j.name.replace(/'/g, "\\'")}', event)" class="p-1 rounded hover:bg-white/[0.08] shrink-0">
                      <i data-lucide="heart" class="w-3.5 h-3.5 ${fav ? 'text-[#D2042D] fill-[#D2042D]' : 'text-slate-500 hover:text-[#D2042D]'}"></i>
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      grid.innerHTML = html;
      lucide.createIcons();
    }

    function pickJournalFromModal(domId, issn) {
      closeDirectoryModal();
      isVaultMode = false;
      isFavJournalsStream = false;
      activeDomain = PSYCH_DOMAINS.find(d => d.id === domId) || PSYCH_DOMAINS[0];
      const idx = activeDomain.journals.findIndex(j => j.issn === issn);
      renderDisciplineStrip();
      selectJournal(idx >= 0 ? idx : null);
    }

    // 17. HELPERS & EXPORTERS
    function pivotByAuthor(authorId, authorName) {
      if (!authorId) return;
      isVaultMode = false;
      activeSnowball = null;
      activeAuthorFilter = { id: authorId, name: authorName };
      resetAndFetch();
    }

    function clearAuthorFilter() {
      activeAuthorFilter = null;
      resetAndFetch();
    }

    function filterByCardJournal(name, issn) {
      if (!issn) return;
      isVaultMode = false;
      activeJournal = { name, issn };
      renderJournalStrip();
      resetAndFetch();
    }

    function triggerSnowball(workId, mode, title) {
      closeInspector();
      isVaultMode = false;
      activeAuthorFilter = null;
      activeSnowball = { workId, mode, title };
      resetAndFetch();
    }

    function clearSnowball() {
      activeSnowball = null;
      resetAndFetch();
    }

    function copyAPA(id) {
      const art = articleMap.get(id) || vaultList.find(v => v.id === id);
      if (!art) return;
      const au = art.authors.length > 0 ? art.authors.join(', ') : 'Yazar Belirtilmemiş';
      navigator.clipboard.writeText(`${au} (${art.pubYear}). ${art.title}. ${art.journalName}. ${art.doi}`);
      showToast('APA 7 atıf kopyalandı.');
    }

    function copyObsidian(id) {
      const art = articleMap.get(id) || vaultList.find(v => v.id === id);
      if (!art) return;
      navigator.clipboard.writeText(buildMarkdownContent(art));
      showToast('Obsidian (.md) notu panoya kopyalandı.');
    }

    function renderPagination() {
      const maxP = Math.min(400, Math.ceil(totalWorksCount / 25) || 1);
      document.getElementById('paginationControls').innerHTML = `
        <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg glass-pill disabled:opacity-30">«</button>
        <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg glass-pill disabled:opacity-30">‹ Önceki</button>
        <span class="px-3 py-1.5 rounded-lg neon-primary-active tabular-nums">${currentPage} / ${maxP}</span>
        <button onclick="goToPage(${currentPage + 1})" ${currentPage >= maxP ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg glass-pill disabled:opacity-30">Sonraki ›</button>
      `;
    }

    function resetToHome() {
      isVaultMode = false;
      isFavJournalsStream = false;
      activeAuthorFilter = null;
      activeSnowball = null;
      activeIntersection = null;
      activeJournal = null;
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('methodSelect').value = 'ALL';
      document.getElementById('sortSelect').value = 'publication_date:desc';
      setYearFilter('2024+');
      updateCounters();
      renderDisciplineStrip();
      renderJournalStrip();
      renderIntersectionChips();
      resetAndFetch();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2600);
    }

    window.addEventListener('DOMContentLoaded', initVibePsych);
  </script>
</body>
</html>
